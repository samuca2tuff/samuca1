<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARBERSHOP • Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #14294d 0%, transparent 35%),
        #05070b;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;

    background: rgba(15, 18, 25, .92);

    border: 1px solid #242b38;

    border-radius: 24px;

    padding: 40px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 40px rgba(52,140,255,.08);

    backdrop-filter: blur(15px);
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo h1 {
    margin: 0;

    font-size: 38px;

    letter-spacing: 6px;
}

.logo span {
    color: #348cff;
}

.logo p {
    margin-top: 10px;

    color: #737b89;

    font-size: 11px;

    letter-spacing: 2px;
}

.title {
    margin-bottom: 25px;
}

.title h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.title p {
    margin: 0;
    color: #777f8d;
    font-size: 13px;
}

label {
    display: block;

    margin:
        18px 0 8px;

    color: #aab1bd;

    font-size: 13px;

    font-weight: 500;
}

.input-box {
    position: relative;
}

input {
    width: 100%;

    padding: 15px 16px;

    background: #090c11;

    border: 1px solid #272e39;

    border-radius: 11px;

    color: white;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

input:focus {
    border-color: #348cff;

    box-shadow:
        0 0 0 3px rgba(52,140,255,.10);
}

button {
    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: 0;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #287cff,
            #1761d6
        );

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 8px 25px rgba(40,124,255,.25);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#status {
    min-height: 20px;

    margin-top: 18px;

    text-align: center;

    font-size: 13px;
}

.error {
    color: #ff6b6b;
}

.success {
    color: #39ff88;
}

.footer {
    text-align: center;

    margin-top: 25px;

    color: #555d69;

    font-size: 11px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">

        <h1>
            BARBER<span>SHOP</span>
        </h1>

        <p>
            BARBERSHOP
        </p>

    </div>


    <div class="title">

        <h2>
            Área do profissional
        </h2>

        <p>
            Entre para acessar o painel de agendamentos.
        </p>

    </div>


    <form id="loginForm">

        <label>
            Usuário
        </label>

        <input
            id="usuario"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
        >


        <label>
            Senha
        </label>

        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
        >


        <button
            id="botao"
            type="submit"
        >
            🔐 ENTRAR NO DASHBOARD
        </button>

    </form>


    <div id="status"></div>


    <div class="footer">
        TEST BARBERSHOP • Área exclusiva
    </div>

</div>


<script>

const form =
    document.getElementById("loginForm");

const botao =
    document.getElementById("botao");

const status =
    document.getElementById("status");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const usuario =
            document
                .getElementById("usuario")
                .value
                .trim();


        const senha =
            document
                .getElementById("senha")
                .value;


        status.className = "";

        status.textContent =
            "⏳ Verificando acesso...";

        botao.disabled = true;


        try {

            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                usuario,
                                senha
                            })

                    }
                );


            const resultado =
                await response.json();


            if (
                response.ok &&
                resultado.success
            ) {

                status.className =
                    "success";

                status.textContent =
                    "✅ Login realizado!";


                setTimeout(
                    function() {

                        window.location.href =
                            "/dashboard.html";

                    },
                    400
                );

            }

            else {

                status.className =
                    "error";

                status.textContent =
                    "❌ " +
                    (
                        resultado.message ||
                        "Usuário ou senha incorretos."
                    );

                botao.disabled = false;

            }

        }

        catch(error) {

            console.error(error);

            status.className =
                "error";

            status.textContent =
                "❌ Não foi possível conectar ao servidor.";

            botao.disabled = false;

        }

    }
);

</script>

</body>
</html>
