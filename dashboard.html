<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAMUCA • Dashboard</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #070707;
    color: white;
}

header {
    height: 75px;
    background: #111;
    border-bottom: 1px solid #292929;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #348cff;
}

.online {
    color: #39ff88;
    font-size: 13px;
}

.container {
    padding: 35px;
    max-width: 1400px;
    margin: auto;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title h1 {
    margin: 0;
}

.refresh {
    padding: 12px 20px;
    border: 0;
    border-radius: 8px;
    background: #287cff;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

/* ABAS */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.tab {
    border: 1px solid #292929;
    background: #111;
    color: #aaa;
    padding: 12px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.tab:hover {
    background: #1b1b1b;
}

.tab.active {
    background: #287cff;
    color: white;
    border-color: #287cff;
}

/* ESTATÍSTICAS */

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.stat {
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
    width: 220px;
}

.stat p {
    color: #777;
    margin: 0;
    font-size: 12px;
}

.stat h2 {
    margin-top: 10px;
    color: #348cff;
}

/* AGENDAMENTOS */

#appointments {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(350px, 1fr)
    );
    gap: 20px;
}

.appointment {
    background: #111;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 22px;
}

.appointment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
}

.appointment-header h2 {
    margin: 0;
    font-size: 20px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    background: #332b00;
    color: #ffd83d;
}

.status.confirmado {
    background: #073b24;
    color: #39ff88;
}

.status.cancelado {
    background: #451414;
    color: #ff6b6b;
}

.status.pago {
    background: #073b24;
    color: #39ff88;
}

.info {
    margin: 10px 0;
    color: #bbb;
}

.info strong {
    color: white;
}

/* BOTÕES */

.actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.actions button {
    flex: 1;
    min-width: 110px;
    padding: 10px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.confirm {
    background: #168b4d;
}

.pending {
    background: #806d00;
}

.cancel {
    background: #8b2424;
}

.payment {
    background: #168b4d;
}

.payment.off {
    background: #555;
}

.delete {
    background: #b32626;
}

.empty {
    color: #666;
    text-align: center;
    padding: 60px;
}

/* CELULAR */

@media (max-width: 600px) {

    header {
        padding: 0 15px;
    }

    .logo {
        font-size: 18px;
    }

    .container {
        padding: 20px 15px;
    }

    #appointments {
        grid-template-columns: 1fr;
    }

    .appointment {
        padding: 18px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        SAM<span>UCA</span> BARBERSHOP
    </div>

    <div class="online">
        ● ONLINE
    </div>

</header>


<div class="container">


    <div class="title">

        <h1>Agendamentos</h1>

        <button
            class="refresh"
            onclick="carregar()"
        >
            ↻ Atualizar
        </button>

    </div>


    <!-- ABAS -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="mudarAba('todos', this)"
        >
            📋 Todos
        </button>

        <button
            class="tab"
            onclick="mudarAba('pendentes', this)"
        >
            ⏳ Pendentes
        </button>

        <button
            class="tab"
            onclick="mudarAba('confirmados', this)"
        >
            ✅ Confirmados
        </button>

        <button
            class="tab"
            onclick="mudarAba('pagos', this)"
        >
            💰 Pagos
        </button>

    </div>


    <!-- ESTATÍSTICAS -->

    <div class="stats">

        <div class="stat">

            <p>TOTAL</p>

            <h2 id="total">0</h2>

        </div>


        <div class="stat">

            <p>PENDENTES</p>

            <h2 id="pendentes">0</h2>

        </div>


        <div class="stat">

            <p>CONFIRMADOS</p>

            <h2 id="confirmados">0</h2>

        </div>


        <div class="stat">

            <p>PAGOS</p>

            <h2 id="pagos">0</h2>

        </div>

    </div>


    <div id="appointments"></div>


</div>


<script>


let todosAgendamentos = [];

let abaAtual = "todos";


// ==============================
// CARREGAR
// ==============================

async function carregar() {

    try {

        const response =
            await fetch("/api/submissions");

        const dados =
            await response.json();


        if (!Array.isArray(dados)) {

            throw new Error(
                "Resposta inválida"
            );

        }


        todosAgendamentos = dados;


        atualizarNumeros();

        mostrarAgendamentos();


    } catch (error) {

        console.error(error);

        document.getElementById(
            "appointments"
        ).innerHTML =
            '<div class="empty">Servidor offline.</div>';

    }

}


// ==============================
// NÚMEROS
// ==============================

function atualizarNumeros() {

    document.getElementById(
        "total"
    ).textContent =
        todosAgendamentos.length;


    document.getElementById(
        "pendentes"
    ).textContent =
        todosAgendamentos.filter(
            x => x.status === "Pendente"
        ).length;


    document.getElementById(
        "confirmados"
    ).textContent =
        todosAgendamentos.filter(
            x => x.status === "Confirmado"
        ).length;


    document.getElementById(
        "pagos"
    ).textContent =
        todosAgendamentos.filter(
            x => x.pago === true
        ).length;

}


// ==============================
// MUDAR ABA
// ==============================

function mudarAba(aba, botao) {

    abaAtual = aba;


    document
        .querySelectorAll(".tab")
        .forEach(
            x => x.classList.remove("active")
        );


    botao.classList.add("active");


    mostrarAgendamentos();

}


// ==============================
// FILTRAR
// ==============================

function mostrarAgendamentos() {

    const container =
        document.getElementById(
            "appointments"
        );


    let dados = [];


    if (abaAtual === "todos") {

        dados =
            todosAgendamentos;

    }


    if (abaAtual === "pendentes") {

        dados =
            todosAgendamentos.filter(
                x => x.status === "Pendente"
            );

    }


    if (abaAtual === "confirmados") {

        dados =
            todosAgendamentos.filter(
                x => x.status === "Confirmado"
            );

    }


    if (abaAtual === "pagos") {

        dados =
            todosAgendamentos.filter(
                x => x.pago === true
            );

    }


    container.innerHTML = "";


    if (dados.length === 0) {

        container.innerHTML =
            '<div class="empty">Nenhum agendamento nesta categoria.</div>';

        return;

    }


    dados.forEach(item => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "appointment";


        let statusClass = "";


        if (item.status === "Confirmado") {

            statusClass =
                "confirmado";

        }


        if (item.status === "Cancelado") {

            statusClass =
                "cancelado";

        }


        card.innerHTML = `

            <div class="appointment-header">

                <h2>
                    ${escapeHTML(item.nome)}
                </h2>

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHTML(item.status)}
                </span>

            </div>


            <div class="info">
                📞 <strong>Telefone:</strong>
                ${escapeHTML(item.telefone)}
            </div>


            <div class="info">
                📧 <strong>E-mail:</strong>
                ${escapeHTML(
                    item.email ||
                    "Não informado"
                )}
            </div>


            <div class="info">
                📅 <strong>Data:</strong>
                ${escapeHTML(item.data)}
            </div>


            <div class="info">
                🕐 <strong>Horário:</strong>
                ${escapeHTML(item.horario)}
            </div>


            <div class="info">
                ✂️ <strong>Serviço:</strong>
                ${escapeHTML(item.servico)}
            </div>


            <div class="info">
                💈 <strong>Corte:</strong>
                ${escapeHTML(item.tipo)}
            </div>


            <div class="info">
                📝 <strong>Observações:</strong>
                ${escapeHTML(
                    item.observacoes ||
                    "Nenhuma"
                )}
            </div>


            <div class="info">

                💰 <strong>Pagamento:</strong>

                ${
                    item.pago
                    ? "✅ Pago"
                    : "⏳ Não pago"
                }

            </div>


            <div class="info">

                <small>
                    Recebido:
                    ${escapeHTML(
                        item.enviadoEm || ""
                    )}
                </small>

            </div>


            <div class="actions">


                <button
                    class="confirm"
                    onclick="mudarStatus(
                        ${item.id},
                        'Confirmado'
                    )"
                >
                    ✓ Confirmar
                </button>


                <button
                    class="pending"
                    onclick="mudarStatus(
                        ${item.id},
                        'Pendente'
                    )"
                >
                    Pendente
                </button>


                <button
                    class="cancel"
                    onclick="mudarStatus(
                        ${item.id},
                        'Cancelado'
                    )"
                >
                    ✕ Cancelar
                </button>


                <button
                    class="${
                        item.pago
                        ? "payment off"
                        : "payment"
                    }"
                    onclick="mudarPagamento(
                        ${item.id},
                        ${!item.pago}
                    )"
                >
                    ${
                        item.pago
                        ? "↩️ Desmarcar pago"
                        : "💰 Marcar pago"
                    }
                </button>


                <button
                    class="delete"
                    onclick="apagarAgendamento(
                        ${item.id}
                    )"
                >
                    🗑️ Apagar
                </button>


            </div>

        `;


        container.appendChild(card);

    });

}


// ==============================
// STATUS
// ==============================

async function mudarStatus(
    id,
    status
) {

    try {

        const response =
            await fetch(
                "/api/status",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id,
                        status
                    })

                }
            );


        const resultado =
            await response.json();


        if (!resultado.success) {

            alert(
                resultado.message ||
                "Erro ao alterar status."
            );

            return;

        }


        await carregar();


    } catch (error) {

        alert(
            "Erro ao conectar ao servidor."
        );

    }

}


// ==============================
// PAGAMENTO
// ==============================

async function mudarPagamento(
    id,
    pago
) {

    try {

        const response =
            await fetch(
                "/api/payment",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id,
                        pago
                    })

                }
            );


        const resultado =
            await response.json();


        if (!resultado.success) {

            alert(
                resultado.message ||
                "Erro ao atualizar pagamento."
            );

            return;

        }


        await carregar();


    } catch (error) {

        alert(
            "Erro ao conectar ao servidor."
        );

    }

}


// ==============================
// APAGAR
// ==============================

async function apagarAgendamento(
    id
) {

    const confirmar =
        confirm(
            "⚠️ Tem certeza que deseja apagar este agendamento?\n\n" +
            "Essa ação não pode ser desfeita."
        );


    if (!confirmar) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/delete",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id
                    })

                }
            );


        const resultado =
            await response.json();


        if (!resultado.success) {

            alert(
                resultado.message ||
                "Erro ao apagar agendamento."
            );

            return;

        }


        await carregar();


    } catch (error) {

        alert(
            "Erro ao conectar ao servidor."
        );

    }

}


// ==============================
// SEGURANÇA HTML
// ==============================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// ==============================
// INICIAR
// ==============================

carregar();


setInterval(
    carregar,
    5000
);

</script>


</body>

</html>
