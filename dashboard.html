<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SAMUCA • Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #070707;
    --card: #111111;
    --card2: #0c0c0c;
    --border: #292929;
    --blue: #348cff;
    --blue2: #287cff;
    --green: #39ff88;
    --yellow: #ffd83d;
    --red: #ff6b6b;
    --orange: #ff9f43;
    --text: #ffffff;
    --muted: #888888;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at top right,
            rgba(52,140,255,.08),
            transparent 30%
        ),
        #070707;

    color: white;

    font-family:
        Inter,
        Arial,
        sans-serif;

    min-height: 100vh;

}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 76px;

    background:
        rgba(17,17,17,.92);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 35px;

    position: sticky;

    top: 0;

    z-index: 20;

}


.logo {

    font-size: 23px;

    font-weight: 900;

    letter-spacing: 3px;

}


.logo span {

    color: var(--blue);

}


.online {

    color: var(--green);

    font-size: 12px;

    font-weight: bold;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 1550px;

    margin: auto;

    padding: 35px;

}


/* =====================================================
   TITLE
===================================================== */

.title {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

}


.title h1 {

    margin: 0;

    font-size: 30px;

}


.subtitle {

    color: var(--muted);

    margin-top: 7px;

    font-size: 13px;

}


.refresh {

    border: 0;

    background:
        linear-gradient(
            135deg,
            #287cff,
            #348cff
        );

    color: white;

    padding:
        13px 20px;

    border-radius: 10px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.refresh:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(40,124,255,.25);

}


/* =====================================================
   STATS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 14px;

    margin-bottom: 25px;

}


.stat {

    background:
        linear-gradient(
            145deg,
            #121212,
            #0d0d0d
        );

    border:
        1px solid var(--border);

    border-radius: 15px;

    padding: 20px;

    transition: .2s;

}


.stat:hover {

    border-color:
        #3b3b3b;

    transform:
        translateY(-2px);

}


.stat p {

    margin: 0;

    color: var(--muted);

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

}


.stat h2 {

    margin:
        10px 0 0;

    font-size: 27px;

    color: var(--blue);

}


/* =====================================================
   TOOLS
===================================================== */

.tools {

    display: grid;

    grid-template-columns:
        1fr 190px;

    gap: 10px;

    margin-bottom: 18px;

}


.search,
.date-filter {

    width: 100%;

    padding: 13px 15px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background: #0d0d0d;

    color: white;

    outline: none;

}


.search:focus,
.date-filter:focus {

    border-color:
        var(--blue);

}


/* =====================================================
   TABS
===================================================== */

.tabs {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    margin-bottom: 25px;

    padding-bottom: 5px;

}


.tab {

    border:
        1px solid var(--border);

    background: #111;

    color: #999;

    border-radius: 10px;

    padding:
        11px 16px;

    white-space: nowrap;

    cursor: pointer;

    font-weight: bold;

    transition: .2s;

}


.tab:hover {

    color: white;

    border-color:
        #444;

}


.tab.active {

    background:
        linear-gradient(
            135deg,
            #287cff,
            #348cff
        );

    border-color:
        var(--blue);

    color: white;

}


/* =====================================================
   APPOINTMENTS
===================================================== */

#appointments {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(350px,1fr)
        );

    gap: 18px;

}


/* =====================================================
   CARD
===================================================== */

.appointment {

    background:
        linear-gradient(
            145deg,
            #121212,
            #0d0d0d
        );

    border:
        1px solid var(--border);

    border-radius: 17px;

    padding: 21px;

    transition: .2s;

    animation:
        aparecer .25s ease;

}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.appointment:hover {

    border-color:
        #3d3d3d;

    transform:
        translateY(-2px);

}


.appointment-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;

}


.appointment-header h2 {

    margin: 0;

    font-size: 20px;

}


.status {

    padding:
        6px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

    white-space: nowrap;

}


/* STATUS */

.status-pendente {

    background: #332b00;

    color: var(--yellow);

}


.status-confirmado {

    background: #073d25;

    color: var(--green);

}


.status-andamento {

    background: #3d2508;

    color: var(--orange);

}


.status-cancelado {

    background: #451818;

    color: var(--red);

}


.status-finalizado {

    background: #172d45;

    color: #6fb4ff;

}


/* =====================================================
   INFO
===================================================== */

.info {

    color: #999;

    font-size: 13px;

    margin:
        9px 0;

    line-height: 1.45;

}


.info strong {

    color: white;

}


/* =====================================================
   PRICE
===================================================== */

.price {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-top: 17px;

    padding: 15px;

    background: #090909;

    border:
        1px solid var(--border);

    border-radius: 11px;

}


.price-value {

    color: var(--green);

    font-size: 21px;

    font-weight: 900;

}


.paid {

    color: var(--green);

    font-weight: bold;

}


.unpaid {

    color: var(--yellow);

    font-weight: bold;

}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 8px;

    margin-top: 18px;

}


.actions button {

    border: 0;

    border-radius: 8px;

    padding: 11px 8px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .15s;

}


.actions button:hover {

    transform:
        translateY(-1px);

    filter:
        brightness(1.12);

}


.confirm {

    background: #168b4d;

}


.pending {

    background: #806d00;

}


.start {

    background: #bd6d15;

}


.cancel {

    background: #8b2424;

}


.payment {

    background: #176b52;

}


.finish {

    background: #287cff;

}


.delete {

    background: #4a2020;

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 80px 20px;

    background: #111;

    border:
        1px solid var(--border);

    border-radius: 17px;

    color: #666;

}


/* =====================================================
   POPUP
===================================================== */

.popup-backdrop {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(8px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;

}


.popup-backdrop.show {

    display: flex;

}


.popup {

    width: 100%;

    max-width: 430px;

    background:
        linear-gradient(
            145deg,
            #181818,
            #0d0d0d
        );

    border:
        1px solid #333;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.55);

    animation:
        popupIn .2s ease;

}


@keyframes popupIn {

    from {

        opacity: 0;

        transform:
            scale(.95)
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

    }

}


.popup-icon {

    font-size: 35px;

    margin-bottom: 10px;

}


.popup h2 {

    margin:
        0 0 8px;

}


.popup p {

    color: #999;

    line-height: 1.5;

    font-size: 14px;

}


.popup-buttons {

    display: flex;

    gap: 10px;

    margin-top: 22px;

}


.popup-buttons button {

    flex: 1;

    padding: 12px;

    border: 0;

    border-radius: 9px;

    cursor: pointer;

    font-weight: bold;

}


.popup-cancel {

    background: #222;

    color: white;

}


.popup-confirm {

    background: var(--blue2);

    color: white;

}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    right: 20px;

    bottom: 20px;

    max-width: 350px;

    padding:
        14px 18px;

    background: #151515;

    border:
        1px solid #333;

    border-radius: 11px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4);

    transform:
        translateY(100px);

    opacity: 0;

    transition: .25s;

    z-index: 200;

}


.toast.show {

    transform:
        translateY(0);

    opacity: 1;

}


.toast.success {

    border-color:
        #176b52;

}


.toast.error {

    border-color:
        #8b2424;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

    header {

        padding:
            0 18px;

    }


    .logo {

        font-size: 16px;

    }


    .container {

        padding:
            22px 15px;

    }


    .title {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .refresh {

        width: 100%;

    }


    .tools {

        grid-template-columns: 1fr;

    }


    #appointments {

        grid-template-columns: 1fr;

    }


    .actions {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        SAM<span>UCA</span> BARBERSHOP

    </div>


    <div class="online">

        ● ONLINE

    </div>

</header>


<div class="container">


    <div class="title">

        <div>

            <h1>
                Dashboard
            </h1>

            <div class="subtitle">
                Gerenciamento de agendamentos
            </div>

        </div>


        <button
            class="refresh"
            onclick="carregar()"
        >

            ↻ Atualizar

        </button>

    </div>


    <!-- =================================================
         ESTATÍSTICAS
    ================================================== -->

    <div class="stats">


        <div class="stat">

            <p>
                TOTAL
            </p>

            <h2 id="total">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                PENDENTES
            </p>

            <h2 id="pendentes">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                CONFIRMADOS
            </p>

            <h2 id="confirmados">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                EM ANDAMENTO
            </p>

            <h2 id="andamento">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                FINALIZADOS
            </p>

            <h2 id="finalizados">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                PAGOS
            </p>

            <h2 id="pagos">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                TOTAL RECEBIDO
            </p>

            <h2 id="recebido">
                $0.00
            </h2>

        </div>


    </div>


    <!-- =================================================
         BUSCA
    ================================================== -->

    <div class="tools">

        <input
            id="busca"
            class="search"
            type="text"
            placeholder="🔎 Buscar por nome ou telefone..."
            oninput="renderizar()"
        >


        <input
            id="filtroData"
            class="date-filter"
            type="date"
            onchange="renderizar()"
        >

    </div>


    <!-- =================================================
         ABAS
    ================================================== -->

    <div class="tabs">


        <button
            class="tab active"
            onclick="mudarAba('todos', this)"
        >
            📋 Todos
        </button>


        <button
            class="tab"
            onclick="mudarAba('Pendente', this)"
        >
            ⏳ Pendentes
        </button>


        <button
            class="tab"
            onclick="mudarAba('Confirmado', this)"
        >
            ✅ Confirmados
        </button>


        <button
            class="tab"
            onclick="mudarAba('Em andamento', this)"
        >
            ✂️ Em andamento
        </button>


        <button
            class="tab"
            onclick="mudarAba('Finalizado', this)"
        >
            🏁 Finalizados
        </button>


        <button
            class="tab"
            onclick="mudarAba('pago', this)"
        >
            💰 Pagos
        </button>


        <button
            class="tab"
            onclick="mudarAba('Cancelado', this)"
        >
            ❌ Cancelados
        </button>


    </div>


    <!-- =================================================
         CARDS
    ================================================== -->

    <div id="appointments"></div>


</div>


<!-- =====================================================
     POPUP
====================================================== -->

<div
    id="popupBackdrop"
    class="popup-backdrop"
>

    <div class="popup">

        <div
            id="popupIcon"
            class="popup-icon"
        >
            ⚠️
        </div>


        <h2 id="popupTitle">
            Confirmar ação
        </h2>


        <p id="popupMessage">
            Tem certeza?
        </p>


        <div class="popup-buttons">

            <button
                class="popup-cancel"
                onclick="fecharPopup()"
            >
                Voltar
            </button>


            <button
                id="popupConfirm"
                class="popup-confirm"
            >
                Confirmar
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TOAST
====================================================== -->

<div
    id="toast"
    class="toast"
>
</div>


<script>

let dados = [];

let filtroAtual = "todos";

let popupCallback = null;


// =====================================================
// CARREGAR
// =====================================================

async function carregar() {

    try {

        const response =
            await fetch(
                "/api/submissions",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Erro no servidor"
            );

        }


        dados =
            await response.json();


        atualizarEstatisticas();

        renderizar();

    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "appointments"
        ).innerHTML = `

            <div class="empty">

                ❌ Não foi possível carregar
                os agendamentos.

                <br><br>

                Verifique o servidor.

            </div>

        `;

    }

}


// =====================================================
// ESTATÍSTICAS
// =====================================================

function atualizarEstatisticas() {

    document.getElementById(
        "total"
    ).textContent =
        dados.length;


    document.getElementById(
        "pendentes"
    ).textContent =

        dados.filter(
            x =>
                x.status === "Pendente"
        ).length;


    document.getElementById(
        "confirmados"
    ).textContent =

        dados.filter(
            x =>
                x.status === "Confirmado"
        ).length;


    document.getElementById(
        "andamento"
    ).textContent =

        dados.filter(
            x =>
                x.status === "Em andamento"
        ).length;


    document.getElementById(
        "finalizados"
    ).textContent =

        dados.filter(
            x =>
                x.status === "Finalizado"
        ).length;


    document.getElementById(
        "pagos"
    ).textContent =

        dados.filter(
            x =>
                x.pago === true
        ).length;


    const recebido =

        dados

            .filter(
                x =>
                    x.pago === true
            )

            .reduce(
                (
                    total,
                    item
                ) =>

                    total +
                    Number(
                        item.preco || 0
                    ),

                0
            );


    document.getElementById(
        "recebido"
    ).textContent =
        formatarPreco(recebido);

}


// =====================================================
// ABA
// =====================================================

function mudarAba(
    filtro,
    botao
) {

    filtroAtual =
        filtro;


    document
        .querySelectorAll(".tab")
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    botao.classList.add(
        "active"
    );


    renderizar();

}


// =====================================================
// RENDERIZAR
// =====================================================

function renderizar() {

    const container =
        document.getElementById(
            "appointments"
        );


    const busca =
        document.getElementById(
            "busca"
        ).value
        .trim()
        .toLowerCase();


    const dataFiltro =
        document.getElementById(
            "filtroData"
        ).value;


    let lista =
        dados.slice();


    // ---------------------------------------------
    // FILTRO ABA
    // ---------------------------------------------

    if (
        filtroAtual !== "todos"
    ) {

        if (
            filtroAtual === "pago"
        ) {

            lista =
                lista.filter(
                    item =>
                        item.pago === true
                );

        }

        else {

            lista =
                lista.filter(
                    item =>
                        item.status ===
                        filtroAtual
                );

        }

    }


    // ---------------------------------------------
    // BUSCA
    // ---------------------------------------------

    if (busca) {

        lista =
            lista.filter(
                item => {

                    const nome =
                        String(
                            item.nome || ""
                        ).toLowerCase();


                    const telefone =
                        String(
                            item.telefone || ""
                        ).toLowerCase();


                    return (

                        nome.includes(
                            busca
                        )

                        ||

                        telefone.includes(
                            busca
                        )

                    );

                }
            );

    }


    // ---------------------------------------------
    // DATA
    // ---------------------------------------------

    if (dataFiltro) {

        lista =
            lista.filter(
                item =>
                    item.data ===
                    dataFiltro
            );

    }


    // ---------------------------------------------
    // VAZIO
    // ---------------------------------------------

    if (
        lista.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                📭

                <br><br>

                Nenhum agendamento
                encontrado.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    // ---------------------------------------------
    // MAIS RECENTES PRIMEIRO
    // ---------------------------------------------

    lista.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "appointment";


            const preco =
                Number(
                    item.preco || 0
                );


            const statusClass =
                getStatusClass(
                    item.status
                );


            const pago =
                item.pago === true;


            card.innerHTML = `

                <div class="appointment-header">

                    <h2>
                        ${escapeHTML(
                            item.nome
                        )}
                    </h2>


                    <span
                        class="status ${statusClass}"
                    >

                        ${escapeHTML(
                            item.status
                        )}

                    </span>

                </div>


                <div class="info">

                    📞
                    <strong>Telefone:</strong>

                    ${escapeHTML(
                        item.telefone
                    )}

                </div>


                <div class="info">

                    📧
                    <strong>E-mail:</strong>

                    ${escapeHTML(
                        item.email ||
                        "Não informado"
                    )}

                </div>


                <div class="info">

                    📅
                    <strong>Data:</strong>

                    ${escapeHTML(
                        item.data
                    )}

                </div>


                <div class="info">

                    🕐
                    <strong>Horário:</strong>

                    ${escapeHTML(
                        item.horario
                    )}

                </div>


                <div class="info">

                    ✂️
                    <strong>Serviço:</strong>

                    ${escapeHTML(
                        item.servico
                    )}

                </div>


                <div class="info">

                    💈
                    <strong>Corte:</strong>

                    ${escapeHTML(
                        item.tipo
                    )}

                </div>


                <div class="info">

                    📝
                    <strong>Observações:</strong>

                    ${escapeHTML(
                        item.observacoes ||
                        "Nenhuma"
                    )}

                </div>


                <div class="price">

                    <span>
                        💵 Valor
                    </span>

                    <span class="price-value">

                        ${formatarPreco(
                            preco
                        )}

                    </span>

                </div>


                <div class="info">

                    💳
                    <strong>Pagamento:</strong>

                    <span
                        class="${
                            pago
                            ? "paid"
                            : "unpaid"
                        }"
                    >

                        ${
                            pago
                            ? "✓ PAGO"
                            : "⏳ NÃO PAGO"
                        }

                    </span>

                </div>


                <div class="info">

                    <small>

                        Recebido:
                        ${formatarData(
                            item.enviadoEm
                        )}

                    </small>

                </div>


                <div class="actions">


                    ${
                        item.status ===
                        "Pendente"

                        ?

                        `

                        <button
                            class="confirm"
                            onclick="
                                mudarStatus(
                                    ${item.id},
                                    'Confirmado'
                                )
                            "
                        >

                            ✓ Confirmar

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        item.status ===
                        "Confirmado"

                        ?

                        `

                        <button
                            class="start"
                            onclick="
                                iniciarCorte(
                                    ${item.id}
                                )
                            "
                        >

                            ✂️ Iniciar corte

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        item.status ===
                        "Em andamento"

                        ?

                        `

                        <button
                            class="finish"
                            onclick="
                                finalizar(
                                    ${item.id}
                                )
                            "
                        >

                            ✓ Finalizar corte

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        (
                            item.status ===
                            "Pendente"

                            ||

                            item.status ===
                            "Confirmado"

                            ||

                            item.status ===
                            "Em andamento"
                        )

                        ?

                        `

                        <button
                            class="cancel"
                            onclick="
                                cancelar(
                                    ${item.id}
                                )
                            "
                        >

                            ❌ Cancelar

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        !pago

                        ?

                        `

                        <button
                            class="payment"
                            onclick="
                                mudarPagamento(
                                    ${item.id},
                                    true
                                )
                            "
                        >

                            💰 Marcar pago

                        </button>

                        `

                        :

                        `

                        <button
                            class="pending"
                            onclick="
                                mudarPagamento(
                                    ${item.id},
                                    false
                                )
                            "
                        >

                            ↩️ Desmarcar pago

                        </button>

                        `

                    }


                    <button
                        class="delete"
                        onclick="
                            apagar(
                                ${item.id}
                            )
                        "
                    >

                        🗑️ Apagar

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


// =====================================================
// INICIAR CORTE
// =====================================================

function iniciarCorte(id) {

    abrirPopup(

        "✂️",

        "Iniciar corte?",

        "O agendamento será movido para 'Em andamento'.",

        async () => {

            await mudarStatus(
                id,
                "Em andamento"
            );

        }

    );

}


// =====================================================
// FINALIZAR
// =====================================================

function finalizar(id) {

    abrirPopup(

        "🏁",

        "Finalizar corte?",

        "O corte será marcado como finalizado e o horário ficará disponível novamente para outro cliente.",

        async () => {

            await mudarStatus(
                id,
                "Finalizado"
            );

        }

    );

}


// =====================================================
// CANCELAR
// =====================================================

function cancelar(id) {

    abrirPopup(

        "❌",

        "Cancelar agendamento?",

        "O horário será liberado para outro cliente.",

        async () => {

            await mudarStatus(
                id,
                "Cancelado"
            );

        }

    );

}


// =====================================================
// STATUS
// =====================================================

async function mudarStatus(
    id,
    status
) {

    try {

        const response =
            await fetch(
                "/api/status",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            id,

                            status

                        })

                }
            );


        const resultado =
            await response.json();


        if (
            !response.ok ||
            !resultado.success
        ) {

            mostrarToast(

                resultado.message ||
                "Erro ao alterar status.",

                "error"

            );

            return false;

        }


        mostrarToast(
            "✓ Status atualizado.",
            "success"
        );


        await carregar();


        return true;

    }

    catch (error) {

        console.error(error);


        mostrarToast(
            "Erro de conexão.",
            "error"
        );


        return false;

    }

}


// =====================================================
// PAGAMENTO
// =====================================================

async function mudarPagamento(
    id,
    pago
) {

    try {

        const response =
            await fetch(
                "/api/payment",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            id,

                            pago

                        })

                }
            );


        const resultado =
            await response.json();


        if (
            !response.ok ||
            !resultado.success
        ) {

            mostrarToast(
                "Erro ao atualizar pagamento.",
                "error"
            );

            return;

        }


        mostrarToast(

            pago
            ? "💰 Pagamento marcado como pago."
            : "Pagamento desmarcado.",

            "success"

        );


        await carregar();

    }

    catch (error) {

        console.error(error);


        mostrarToast(
            "Erro de conexão.",
            "error"
        );

    }

}


// =====================================================
// APAGAR
// =====================================================

function apagar(id) {

    abrirPopup(

        "🗑️",

        "Apagar agendamento?",

        "Essa ação é permanente e não poderá ser desfeita.",

        async () => {

            try {

                const response =
                    await fetch(
                        "/api/delete",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    id

                                })

                        }
                    );


                const resultado =
                    await response.json();


                if (
                    !response.ok ||
                    !resultado.success
                ) {

                    mostrarToast(

                        resultado.message ||
                        "Erro ao apagar.",

                        "error"

                    );

                    return;

                }


                mostrarToast(
                    "🗑️ Agendamento apagado.",
                    "success"
                );


                await carregar();

            }

            catch (error) {

                console.error(error);


                mostrarToast(
                    "Erro de conexão.",
                    "error"
                );

            }

        }

    );

}


// =====================================================
// POPUP
// =====================================================

function abrirPopup(
    icone,
    titulo,
    mensagem,
    callback
) {

    document.getElementById(
        "popupIcon"
    ).textContent =
        icone;


    document.getElementById(
        "popupTitle"
    ).textContent =
        titulo;


    document.getElementById(
        "popupMessage"
    ).textContent =
        mensagem;


    popupCallback =
        callback;


    document
        .getElementById(
            "popupBackdrop"
        )
        .classList.add(
            "show"
        );

}


function fecharPopup() {

    document
        .getElementById(
            "popupBackdrop"
        )
        .classList.remove(
            "show"
        );


    popupCallback =
        null;

}


document.getElementById(
    "popupConfirm"
).addEventListener(
    "click",
    async function() {

        const callback =
            popupCallback;


        fecharPopup();


        if (callback) {

            await callback();

        }

    }
);


document.getElementById(
    "popupBackdrop"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            fecharPopup();

        }

    }
);


// =====================================================
// TOAST
// =====================================================

let toastTimer;


function mostrarToast(
    mensagem,
    tipo = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        mensagem;


    toast.className =
        `toast ${tipo} show`;


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


// =====================================================
// STATUS CLASS
// =====================================================

function getStatusClass(
    status
) {

    if (
        status === "Pendente"
    ) {

        return "status-pendente";

    }


    if (
        status === "Confirmado"
    ) {

        return "status-confirmado";

    }


    if (
        status === "Em andamento"
    ) {

        return "status-andamento";

    }


    if (
        status === "Cancelado"
    ) {

        return "status-cancelado";

    }


    if (
        status === "Finalizado"
    ) {

        return "status-finalizado";

    }


    return "";

}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto ?? "";


    return div.innerHTML;

}


// =====================================================
// PREÇO
// =====================================================

function formatarPreco(
    valor
) {

    return "$" +
        Number(
            valor || 0
        ).toFixed(2);

}


// =====================================================
// DATA
// =====================================================

function formatarData(
    valor
) {

    if (!valor) {

        return "Não informado";

    }


    try {

        return new Date(
            valor
        ).toLocaleString(
            "pt-BR"
        );

    }

    catch {

        return valor;

    }

}


// =====================================================
// ATUALIZAÇÃO AUTOMÁTICA
// =====================================================

carregar();


setInterval(
    carregar,
    5000
);
