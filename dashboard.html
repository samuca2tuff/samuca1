<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARBERSHOP • Dashboard</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #070707;
    color: white;
}

header {
    min-height: 75px;
    background: #111;
    border-bottom: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 35px;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #348cff;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.online {
    color: #39ff88;
    font-size: 13px;
}

.logout {
    padding: 9px 16px;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    background: #191919;
    color: #ff6b6b;
    font-weight: bold;
    cursor: pointer;
}

.logout:hover {
    background: #3a1616;
    border-color: #ff6b6b;
}

.container {
    padding: 35px;
    max-width: 1500px;
    margin: auto;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.title h1 {
    margin: 0;
}

.refresh {
    padding: 12px 20px;
    border: 0;
    border-radius: 8px;
    background: #287cff;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.stat {
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.stat p {
    color: #777;
    margin: 0;
    font-size: 12px;
}

.stat h2 {
    margin: 10px 0 0;
    color: #348cff;
}

.report {
    margin-bottom: 30px;
}

.report h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.report-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.report-card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.report-card p {
    color: #777;
    margin: 0;
    font-size: 12px;
}

.report-card h2 {
    color: #39ff88;
    margin: 10px 0 0;
}

.filters {
    display: grid;
    grid-template-columns: 1fr 220px auto;
    gap: 12px;
    margin-bottom: 25px;
}

.filters input {
    width: 100%;
    padding: 13px 15px;
    border-radius: 8px;
    border: 1px solid #292929;
    background: #111;
    color: white;
    outline: none;
}

.filters input:focus {
    border-color: #348cff;
}

.filters input[type="date"] {
    color-scheme: dark;
}

.clear-filter {
    padding: 12px 18px;
    border: 1px solid #292929;
    border-radius: 8px;
    background: #191919;
    color: white;
    cursor: pointer;
}

.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 25px;
    padding-bottom: 5px;
}

.tab {
    white-space: nowrap;
    padding: 11px 18px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    color: #aaa;
    cursor: pointer;
    font-weight: bold;
}

.tab:hover {
    color: white;
}

.tab.active {
    background: #287cff;
    border-color: #287cff;
    color: white;
}

#appointments {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
}

.appointment {
    background: #111;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 22px;
    transition: transform .15s, border .15s;
}

.appointment:hover {
    transform: translateY(-2px);
    border-color: #3a3a3a;
}

.appointment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.appointment-header h2 {
    margin: 0;
    font-size: 20px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pendente {
    background: #332b00;
    color: #ffd83d;
}

.status-confirmado {
    background: #073d25;
    color: #39ff88;
}

.status-andamento {
    background: #30204a;
    color: #bd8cff;
}

.status-cancelado {
    background: #451818;
    color: #ff6b6b;
}

.status-finalizado {
    background: #172d45;
    color: #6fb4ff;
}

.info {
    margin: 10px 0;
    color: #aaa;
    line-height: 1.5;
}

.info strong {
    color: white;
}

.price {
    margin-top: 18px;
    padding: 15px;
    background: #090909;
    border: 1px solid #292929;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.price span:last-child {
    color: #39ff88;
    font-size: 20px;
    font-weight: bold;
}

.paid {
    color: #39ff88;
    font-weight: bold;
}

.unpaid {
    color: #ffd83d;
    font-weight: bold;
}

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 20px;
}

.actions button {
    padding: 11px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.confirm {
    background: #168b4d;
}

.pending {
    background: #806d00;
}

.progress {
    background: #6542a3;
}

.cancel {
    background: #8b2424;
}

.payment {
    background: #176b52;
}

.finish {
    background: #287cff;
}

.delete {
    background: #4a2020;
}

.actions button:hover {
    opacity: .85;
}

.empty {
    grid-column: 1 / -1;
    color: #666;
    text-align: center;
    padding: 70px 20px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 15px;
}

.history-info {
    margin-bottom: 20px;
    padding: 15px 18px;
    background: #0d2419;
    border: 1px solid #164d31;
    border-radius: 10px;
    color: #39ff88;
}

@media(max-width: 700px) {

    header {
        padding: 15px 18px;
    }

    .logo {
        font-size: 16px;
    }

    .online {
        display: none;
    }

    .container {
        padding: 20px 15px;
    }

    .title {
        align-items: flex-start;
        flex-direction: column;
    }

    .title h1 {
        font-size: 24px;
    }

    .refresh {
        width: 100%;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    #appointments {
        grid-template-columns: 1fr;
    }

    .actions {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        BARBER<span>SHOP</span> TESTE
    </div>

    <div class="header-right">

        <div class="online">
            ● ONLINE
        </div>

        <button class="logout" onclick="sair()">
            🚪 Sair
        </button>

    </div>

</header>

<div class="container">

    <div class="title">

        <h1>
            Agendamentos
        </h1>

        <button class="refresh" onclick="carregar()">
            ↻ Atualizar
        </button>

    </div>

    <div class="stats">

        <div class="stat">
            <p>TOTAL</p>
            <h2 id="total">0</h2>
        </div>

        <div class="stat">
            <p>PENDENTES</p>
            <h2 id="pendentes">0</h2>
        </div>

        <div class="stat">
            <p>CONFIRMADOS</p>
            <h2 id="confirmados">0</h2>
        </div>

        <div class="stat">
            <p>EM ANDAMENTO</p>
            <h2 id="andamento">0</h2>
        </div>

        <div class="stat">
            <p>PAGOS</p>
            <h2 id="pagos">0</h2>
        </div>

        <div class="stat">
            <p>FINALIZADOS</p>
            <h2 id="finalizados">0</h2>
        </div>

        <div class="stat">
            <p>TOTAL RECEBIDO</p>
            <h2 id="recebido">$0.00</h2>
        </div>

    </div>

    <div class="report">

        <h2>📊 Relatório de ganhos</h2>

        <div class="report-grid">

            <div class="report-card">
                <p>HOJE</p>
                <h2 id="ganhoHoje">$0.00</h2>
            </div>

            <div class="report-card">
                <p>ESTA SEMANA</p>
                <h2 id="ganhoSemana">$0.00</h2>
            </div>

            <div class="report-card">
                <p>ESTE MÊS</p>
                <h2 id="ganhoMes">$0.00</h2>
            </div>

        </div>

    </div>

    <div class="filters">

        <input
            type="text"
            id="busca"
            placeholder="🔎 Buscar por nome ou telefone..."
            oninput="renderizar()"
        >

        <input
            type="date"
            id="filtroData"
            onchange="renderizar()"
        >

        <button class="clear-filter" onclick="limparFiltros()">
            Limpar filtros
        </button>

    </div>

    <div class="tabs">

        <button class="tab active" onclick="mudarAba('todos', this)">
            📋 Todos
        </button>

        <button class="tab" onclick="mudarAba('Pendente', this)">
            ⏳ Pendentes
        </button>

        <button class="tab" onclick="mudarAba('Confirmado', this)">
            ✅ Confirmados
        </button>

        <button class="tab" onclick="mudarAba('Em andamento', this)">
            💈 Em andamento
        </button>

        <button class="tab" onclick="mudarAba('pago', this)">
            💰 Pagos
        </button>

        <button class="tab" onclick="mudarAba('historico', this)">
            📚 Histórico pago
        </button>

        <button class="tab" onclick="mudarAba('Finalizado', this)">
            ✂️ Finalizados
        </button>

        <button class="tab" onclick="mudarAba('Cancelado', this)">
            ❌ Cancelados
        </button>

    </div>

    <div id="appointments"></div>

</div>

<script>

let dados = [];

let filtroAtual = "todos";


// =====================================================
// LOGIN
// =====================================================

async function verificarLogin() {

    try {

        const response =
            await fetch("/api/auth");

        if (!response.ok) {

            window.location.href =
                "/login.html";

            return false;

        }

        return true;

    }

    catch(error) {

        console.error(error);

        window.location.href =
            "/login.html";

        return false;

    }

}


// =====================================================
// CARREGAR AGENDAMENTOS
// =====================================================

async function carregar() {

    try {

        const response =
            await fetch("/api/submissions", {
                cache: "no-store"
            });

        if (response.status === 401) {

            window.location.href =
                "/login.html";

            return;

        }

        if (!response.ok) {

            throw new Error(
                "Erro no servidor"
            );

        }

        const resultado =
            await response.json();


        // GARANTE QUE DADOS SEJA UM ARRAY

        if (Array.isArray(resultado)) {

            dados = resultado;

        }

        else if (
            resultado &&
            Array.isArray(resultado.appointments)
        ) {

            dados =
                resultado.appointments;

        }

        else {

            dados = [];

        }


        console.log(
            "AGENDAMENTOS RECEBIDOS:",
            dados
        );


        atualizarEstatisticas();

        atualizarRelatorio();

        renderizar();

    }

    catch(error) {

        console.error(
            "Erro carregando agendamentos:",
            error
        );


        document.getElementById(
            "appointments"
        ).innerHTML = `

            <div class="empty">

                ❌ Não foi possível carregar os agendamentos.

                <br><br>

                Tente clicar em Atualizar.

            </div>

        `;

    }

}


// =====================================================
// ESTATÍSTICAS
// =====================================================

function atualizarEstatisticas() {

    document.getElementById("total").textContent =
        dados.length;


    document.getElementById("pendentes").textContent =
        dados.filter(
            item =>
                String(item.status || "").trim() === "Pendente"
        ).length;


    document.getElementById("confirmados").textContent =
        dados.filter(
            item =>
                String(item.status || "").trim() === "Confirmado"
        ).length;


    document.getElementById("andamento").textContent =
        dados.filter(
            item =>
                String(item.status || "").trim() === "Em andamento"
        ).length;


    document.getElementById("pagos").textContent =
        dados.filter(
            item =>
                item.pago === true ||
                item.pago === "true"
        ).length;


    document.getElementById("finalizados").textContent =
        dados.filter(
            item =>
                String(item.status || "").trim() === "Finalizado"
        ).length;


    const totalRecebido =
        dados
            .filter(
                item =>
                    item.pago === true ||
                    item.pago === "true"
            )
            .reduce(
                (total, item) =>
                    total +
                    Number(item.preco || 0),
                0
            );


    document.getElementById("recebido").textContent =
        formatarPreco(totalRecebido);

}


// =====================================================
// RELATÓRIO
// =====================================================

function atualizarRelatorio() {

    const hoje =
        new Date();


    const hojeTexto =
        formatarDataISO(hoje);


    const inicioSemana =
        new Date(hoje);


    const diaSemana =
        hoje.getDay();


    const diferenca =
        diaSemana === 0
            ? 6
            : diaSemana - 1;


    inicioSemana.setDate(
        hoje.getDate() - diferenca
    );


    inicioSemana.setHours(
        0,
        0,
        0,
        0
    );


    const inicioMes =
        new Date(
            hoje.getFullYear(),
            hoje.getMonth(),
            1
        );


    let ganhoHoje = 0;

    let ganhoSemana = 0;

    let ganhoMes = 0;


    dados.forEach(item => {

        if (
            !(
                item.pago === true ||
                item.pago === "true"
            )
        ) {

            return;

        }


        const valor =
            Number(item.preco || 0);


        const dataItem =
            criarDataLocal(item.data);


        if (
            item.data === hojeTexto
        ) {

            ganhoHoje += valor;

        }


        if (
            dataItem >= inicioSemana
        ) {

            ganhoSemana += valor;

        }


        if (
            dataItem >= inicioMes
        ) {

            ganhoMes += valor;

        }

    });


    document.getElementById(
        "ganhoHoje"
    ).textContent =
        formatarPreco(ganhoHoje);


    document.getElementById(
        "ganhoSemana"
    ).textContent =
        formatarPreco(ganhoSemana);


    document.getElementById(
        "ganhoMes"
    ).textContent =
        formatarPreco(ganhoMes);

}


// =====================================================
// ABAS
// =====================================================

function mudarAba(
    filtro,
    botao
) {

    filtroAtual =
        filtro;


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove(
                "active"
            );

        });


    botao.classList.add(
        "active"
    );


    renderizar();

}


// =====================================================
// LIMPAR FILTROS
// =====================================================

function limparFiltros() {

    document.getElementById(
        "busca"
    ).value = "";


    document.getElementById(
        "filtroData"
    ).value = "";


    renderizar();

}


// =====================================================
// RENDERIZAR
// =====================================================

function renderizar() {

    const container =
        document.getElementById(
            "appointments"
        );


    const busca =
        document
            .getElementById("busca")
            .value
            .trim()
            .toLowerCase();


    const dataFiltro =
        document.getElementById(
            "filtroData"
        ).value;


    let lista =
        dados.slice();


    // =================================================
    // FILTRO DA ABA
    // =================================================

    if (
        filtroAtual !== "todos"
    ) {

        if (
            filtroAtual === "pago"
        ) {

            lista =
                lista.filter(
                    item =>
                        item.pago === true ||
                        item.pago === "true"
                );

        }

        else if (
            filtroAtual === "historico"
        ) {

            lista =
                lista.filter(
                    item =>
                        item.pago === true ||
                        item.pago === "true"
                );

        }

        else {

            lista =
                lista.filter(
                    item =>
                        String(
                            item.status || ""
                        ).trim() ===
                        filtroAtual
                );

        }

    }


    // =================================================
    // BUSCA
    // =================================================

    if (busca) {

        const buscaNormalizada =
            normalizar(busca);


        lista =
            lista.filter(item => {

                return (

                    normalizar(
                        item.nome
                    ).includes(
                        buscaNormalizada
                    )

                    ||

                    normalizar(
                        item.telefone
                    ).includes(
                        buscaNormalizada
                    )

                    ||

                    normalizar(
                        item.email
                    ).includes(
                        buscaNormalizada
                    )

                    ||

                    normalizar(
                        item.servico
                    ).includes(
                        buscaNormalizada
                    )

                    ||

                    normalizar(
                        item.horario
                    ).includes(
                        buscaNormalizada
                    )

                    ||

                    normalizar(
                        item.tipo
                    ).includes(
                        buscaNormalizada
                    )

                );

            });

    }


    // =================================================
    // FILTRO DE DATA
    // =================================================

    // SOMENTE FILTRA SE O USUÁRIO ESCOLHER UMA DATA.

    if (dataFiltro) {

        lista =
            lista.filter(
                item =>
                    String(item.data || "")
                    .trim() === dataFiltro
            );

    }


    // =================================================
    // NENHUM RESULTADO
    // =================================================

    if (
        lista.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                📭 Nenhum agendamento encontrado.

                <br><br>

                ${
                    dados.length > 0
                        ? "Tente remover os filtros."
                        : "Ainda não existem agendamentos."
                }

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    // =================================================
    // CARDS
    // =================================================

    lista.forEach(item => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "appointment";


        const statusClass =
            getStatusClass(
                item.status
            );


        const preco =
            Number(
                item.preco || 0
            );


        const estaPago =
            item.pago === true ||
            item.pago === "true";


        const pagoTexto =
            estaPago
                ? "✓ PAGO"
                : "Não pago";


        const pagoClass =
            estaPago
                ? "paid"
                : "unpaid";


        card.innerHTML = `

            <div class="appointment-header">

                <h2>
                    ${escapeHTML(
                        item.nome ||
                        "Sem nome"
                    )}
                </h2>

                <span class="status ${statusClass}">
                    ${escapeHTML(
                        item.status ||
                        "Pendente"
                    )}
                </span>

            </div>


            <div class="info">

                📞

                <strong>
                    Telefone:
                </strong>

                ${escapeHTML(
                    item.telefone ||
                    "Não informado"
                )}

            </div>


            <div class="info">

                📧

                <strong>
                    E-mail:
                </strong>

                ${escapeHTML(
                    item.email ||
                    "Não informado"
                )}

            </div>


            <div class="info">

                📅

                <strong>
                    Data:
                </strong>

                ${formatarData(
                    item.data
                )}

            </div>


            <div class="info">

                🕐

                <strong>
                    Horário:
                </strong>

                ${escapeHTML(
                    item.horario ||
                    "Não informado"
                )}

            </div>


            <div class="info">

                ✂️

                <strong>
                    Serviço:
                </strong>

                ${escapeHTML(
                    item.servico ||
                    "Não informado"
                )}

            </div>


            <div class="info">

                💈

                <strong>
                    Corte:
                </strong>

                ${escapeHTML(
                    item.tipo ||
                    "Não informado"
                )}

            </div>


            <div class="info">

                📝

                <strong>
                    Observações:
                </strong>

                ${escapeHTML(
                    item.observacoes ||
                    "Nenhuma"
                )}

            </div>


            <div class="price">

                <span>
                    💵 Valor
                </span>

                <span>
                    ${formatarPreco(
                        preco
                    )}
                </span>

            </div>


            <div class="info">

                💰

                <strong>
                    Pagamento:
                </strong>

                <span class="${pagoClass}">
                    ${pagoTexto}
                </span>

            </div>


            <div class="actions">


                ${
                    item.status !== "Confirmado" &&
                    item.status !== "Em andamento" &&
                    item.status !== "Finalizado"

                    ?

                    `

                    <button
                        class="confirm"
                        onclick="mudarStatus(
                            ${Number(item.id)},
                            'Confirmado'
                        )"
                    >

                        ✓ Confirmar

                    </button>

                    `

                    :

                    ""

                }


                ${
                    item.status === "Confirmado"

                    ?

                    `

                    <button
                        class="progress"
                        onclick="mudarStatus(
                            ${Number(item.id)},
                            'Em andamento'
                        )"
                    >

                        💈 Iniciar Corte

                    </button>

                    `

                    :

                    ""

                }


                ${
                    item.status !== "Pendente" &&
                    item.status !== "Finalizado" &&
                    item.status !== "Cancelado"

                    ?

                    `

                    <button
                        class="pending"
                        onclick="mudarStatus(
                            ${Number(item.id)},
                            'Pendente'
                        )"
                    >

                        ⏳ Pendente

                    </button>

                    `

                    :

                    ""

                }


                ${
                    item.status !== "Cancelado" &&
                    item.status !== "Finalizado"

                    ?

                    `

                    <button
                        class="cancel"
                        onclick="mudarStatus(
                            ${Number(item.id)},
                            'Cancelado'
                        )"
                    >

                        ❌ Cancelar

                    </button>

                    `

                    :

                    ""

                }


                ${
                    !estaPago

                    ?

                    `

                    <button
                        class="payment"
                        onclick="mudarPagamento(
                            ${Number(item.id)},
                            true
                        )"
                    >

                        💰 Marcar Pago

                    </button>

                    `

                    :

                    `

                    <button
                        class="pending"
                        onclick="mudarPagamento(
                            ${Number(item.id)},
                            false
                        )"
                    >

                        ↩️ Desmarcar Pago

                    </button>

                    `

                }


                ${
                    item.status !== "Finalizado" &&
                    item.status !== "Cancelado"

                    ?

                    `

                    <button
                        class="finish"
                        onclick="finalizar(
                            ${Number(item.id)}
                        )"
                    >

                        ✂️ Finalizar Corte

                    </button>

                    `

                    :

                    ""

                }


                <button
                    class="delete"
                    onclick="apagar(
                        ${Number(item.id)}
                    )"
                >

                    🗑️ Apagar

                </button>


            </div>

        `;


        container.appendChild(
            card
        );

    });

}


// =====================================================
// NORMALIZAR
// =====================================================

function normalizar(valor) {

    return String(
        valor || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^a-z0-9]/g,
        ""
    );

}


// =====================================================
// STATUS
// =====================================================

async function mudarStatus(
    id,
    status
) {

    if (
        status === "Cancelado"
    ) {

        const confirmar =
            confirm(
                "Tem certeza que deseja cancelar este agendamento?"
            );


        if (!confirmar) {
            return;
        }

    }


    try {

        const response =
            await fetch(
                "/api/status",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            id,
                            status
                        })

                }
            );


        if (
            response.status === 401
        ) {

            window.location.href =
                "/login.html";

            return;

        }


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            alert(
                resultado.message ||
                "Erro ao atualizar."
            );

            return;

        }


        await carregar();

    }

    catch(error) {

        console.error(error);

        alert(
            "Erro de conexão."
        );

    }

}

    if (!confirmar) {

    await mudarStatus(

}

// =====================================================
// CLASSE DO STATUS
// =====================================================

function getStatusClass(status) {

    status =
        String(
            status || ""
        ).trim();


    if (
        status === "Pendente"
    )
        return "status-pendente";


    if (
        status === "Confirmado"
    )
        return "status-confirmado";


    if (
        status === "Em andamento"
    )
        return "status-andamento";


    if (
        status === "Cancelado"
    )
        return "status-cancelado";


    if (
        status === "Finalizado"
    )
        return "status-finalizado";


    return "";

}


// =====================================================
// SEGURANÇA HTML
// =====================================================

function escapeHTML(texto) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto ?? "";


    return div.innerHTML;

}


// =====================================================
// PREÇO
// =====================================================

function formatarPreco(valor) {

    return "$" +
        Number(
            valor || 0
        ).toFixed(2);

}


// =====================================================
// DATA
// =====================================================

function criarDataLocal(data) {

    if (!data) {

        return new Date(
            "invalid"
        );

    }


    const partes =
        String(data).split("-");


    if (
        partes.length !== 3
    ) {

        return new Date(
            "invalid"
        );

    }


    return new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

}


function formatarDataISO(data) {

    const ano =
        data.getFullYear();


    const mes =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );

}


function formatarData(data) {

    if (!data) {

        return "Não informada";

    }


    const partes =
        String(data).split("-");


    if (
        partes.length !== 3
    ) {

        return escapeHTML(
            data
        );

    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}
