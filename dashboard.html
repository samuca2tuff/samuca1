<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SAMUCA • Dashboard</title>


<style>

* {

    box-sizing: border-box;

    font-family:
        Arial,
        sans-serif;

}


body {

    margin: 0;

    background: #070707;

    color: white;

}


/* =========================================
   HEADER
========================================= */

header {

    height: 75px;

    background: #111;

    border-bottom:
        1px solid #292929;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 35px;

}


.logo {

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 3px;

}


.logo span {

    color: #348cff;

}


.online {

    color: #39ff88;

    font-size: 13px;

}


/* =========================================
   CONTAINER
========================================= */

.container {

    padding: 35px;

    max-width: 1500px;

    margin: auto;

}


/* =========================================
   TÍTULO
========================================= */

.title {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 25px;

}


.title h1 {

    margin: 0;

}


.refresh {

    padding:
        12px 20px;

    border: 0;

    border-radius: 8px;

    background: #287cff;

    color: white;

    cursor: pointer;

    font-weight: bold;

}


/* =========================================
   ESTATÍSTICAS
========================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap: 15px;

    margin-bottom: 30px;

}


.stat {

    background: #111;

    border:
        1px solid #292929;

    border-radius: 12px;

    padding: 20px;

}


.stat p {

    color: #777;

    margin: 0;

    font-size: 12px;

}


.stat h2 {

    margin:
        10px 0 0;

    color: #348cff;

}


/* =========================================
   ABAS
========================================= */

.tabs {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    margin-bottom: 25px;

    padding-bottom: 5px;

}


.tab {

    white-space: nowrap;

    padding:
        11px 18px;

    background: #111;

    border:
        1px solid #292929;

    border-radius: 8px;

    color: #aaa;

    cursor: pointer;

    font-weight: bold;

}


.tab:hover {

    color: white;

}


.tab.active {

    background: #287cff;

    border-color: #287cff;

    color: white;

}


/* =========================================
   AGENDAMENTOS
========================================= */

#appointments {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(350px, 1fr)
        );

    gap: 20px;

}


/* =========================================
   CARD
========================================= */

.appointment {

    background: #111;

    border:
        1px solid #292929;

    border-radius: 15px;

    padding: 22px;

    transition:
        transform .15s,
        border .15s;

}


.appointment:hover {

    transform:
        translateY(-2px);

    border-color:
        #3a3a3a;

}


.appointment-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;

}


.appointment-header h2 {

    margin: 0;

    font-size: 20px;

}


.status {

    padding:
        6px 10px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

}


/* STATUS */

.status-pendente {

    background: #332b00;

    color: #ffd83d;

}


.status-confirmado {

    background: #073d25;

    color: #39ff88;

}


.status-cancelado {

    background: #451818;

    color: #ff6b6b;

}


.status-finalizado {

    background: #172d45;

    color: #6fb4ff;

}


/* =========================================
   INFO
========================================= */

.info {

    margin:
        10px 0;

    color: #aaa;

    line-height: 1.4;

}


.info strong {

    color: white;

}


.price {

    margin-top: 18px;

    padding:
        15px;

    background: #090909;

    border:
        1px solid #292929;

    border-radius: 10px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

}


.price span:last-child {

    color: #39ff88;

    font-size: 20px;

    font-weight: bold;

}


.paid {

    color: #39ff88;

    font-weight: bold;

}


.unpaid {

    color: #ffd83d;

    font-weight: bold;

}


/* =========================================
   AÇÕES
========================================= */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    margin-top: 20px;

}


.actions button {

    padding: 11px;

    border: 0;

    border-radius: 7px;

    cursor: pointer;

    color: white;

    font-weight: bold;

}


.confirm {

    background: #168b4d;

}


.pending {

    background: #806d00;

}


.cancel {

    background: #8b2424;

}


.payment {

    background: #176b52;

}


.finish {

    background: #287cff;

}


.delete {

    background: #4a2020;

}


.actions button:hover {

    opacity: .85;

}


/* =========================================
   VAZIO
========================================= */

.empty {

    grid-column: 1 / -1;

    color: #666;

    text-align: center;

    padding: 70px 20px;

    background: #111;

    border:
        1px solid #292929;

    border-radius: 15px;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 600px) {

    header {

        padding:
            0 18px;

    }


    .logo {

        font-size: 17px;

    }


    .container {

        padding:
            20px 15px;

    }


    .title {

        align-items:
            flex-start;

        gap: 15px;

    }


    .title h1 {

        font-size: 24px;

    }


    #appointments {

        grid-template-columns:
            1fr;

    }


    .actions {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        SAM<span>UCA</span> BARBERSHOP

    </div>


    <div class="online">

        ● ONLINE

    </div>

</header>


<div class="container">


    <div class="title">

        <h1>
            Agendamentos
        </h1>


        <button
            class="refresh"
            onclick="carregar()"
        >

            ↻ Atualizar

        </button>

    </div>


    <!-- =====================================
         ESTATÍSTICAS
    ====================================== -->

    <div class="stats">


        <div class="stat">

            <p>
                TOTAL
            </p>

            <h2 id="total">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                PENDENTES
            </p>

            <h2 id="pendentes">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                CONFIRMADOS
            </p>

            <h2 id="confirmados">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                PAGOS
            </p>

            <h2 id="pagos">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                FINALIZADOS
            </p>

            <h2 id="finalizados">
                0
            </h2>

        </div>


        <div class="stat">

            <p>
                TOTAL RECEBIDO
            </p>

            <h2 id="recebido">
                $0.00
            </h2>

        </div>


    </div>


    <!-- =====================================
         ABAS
    ====================================== -->

    <div class="tabs">


        <button
            class="tab active"
            data-filter="todos"
            onclick="mudarAba('todos', this)"
        >
            📋 Todos
        </button>


        <button
            class="tab"
            data-filter="Pendente"
            onclick="mudarAba('Pendente', this)"
        >
            ⏳ Pendentes
        </button>


        <button
            class="tab"
            data-filter="Confirmado"
            onclick="mudarAba('Confirmado', this)"
        >
            ✅ Confirmados
        </button>


        <button
            class="tab"
            data-filter="pago"
            onclick="mudarAba('pago', this)"
        >
            💰 Pagos
        </button>


        <button
            class="tab"
            data-filter="Finalizado"
            onclick="mudarAba('Finalizado', this)"
        >
            ✂️ Finalizados
        </button>


        <button
            class="tab"
            data-filter="Cancelado"
            onclick="mudarAba('Cancelado', this)"
        >
            ❌ Cancelados
        </button>


    </div>


    <!-- =====================================
         CARDS
    ====================================== -->

    <div id="appointments"></div>


</div>


<script>


let dados = [];

let filtroAtual =
    "todos";


// =================================================
// CARREGAR
// =================================================

async function carregar() {

    try {

        const response =
            await fetch(
                "/api/submissions"
            );


        if (!response.ok) {

            throw new Error(
                "Erro no servidor"
            );

        }


        dados =
            await response.json();


        atualizarEstatisticas();

        renderizar();


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "appointments"
        ).innerHTML = `

            <div class="empty">

                ❌ Servidor offline.

                <br><br>

                Verifique se o Render está online.

            </div>

        `;

    }

}


// =================================================
// ESTATÍSTICAS
// =================================================

function atualizarEstatisticas() {


    document.getElementById(
        "total"
    ).textContent =
        dados.length;


    document.getElementById(
        "pendentes"
    ).textContent =

        dados.filter(
            x =>
                x.status ===
                "Pendente"
        ).length;


    document.getElementById(
        "confirmados"
    ).textContent =

        dados.filter(
            x =>
                x.status ===
                "Confirmado"
        ).length;


    document.getElementById(
        "pagos"
    ).textContent =

        dados.filter(
            x =>
                x.pago === true
        ).length;


    document.getElementById(
        "finalizados"
    ).textContent =

        dados.filter(
            x =>
                x.status ===
                "Finalizado"
        ).length;


    const totalRecebido =

        dados

            .filter(
                x =>
                    x.pago === true
            )

            .reduce(
                (
                    total,
                    item
                ) =>

                    total +
                    Number(
                        item.preco || 0
                    ),

                0
            );


    document.getElementById(
        "recebido"
    ).textContent =

        formatarPreco(
            totalRecebido
        );

}


// =================================================
// ABAS
// =================================================

function mudarAba(
    filtro,
    botao
) {

    filtroAtual =
        filtro;


    document
        .querySelectorAll(".tab")
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    botao.classList.add(
        "active"
    );


    renderizar();

}


// =================================================
// RENDERIZAR
// =================================================

function renderizar() {


    const container =
        document.getElementById(
            "appointments"
        );


    let lista =
        dados.slice();


    // ---------------------------------------------
    // FILTRO
    // ---------------------------------------------

    if (
        filtroAtual !==
        "todos"
    ) {

        if (
            filtroAtual ===
            "pago"
        ) {

            lista =
                lista.filter(
                    item =>
                        item.pago === true
                );

        }

        else {

            lista =
                lista.filter(
                    item =>
                        item.status ===
                        filtroAtual
                );

        }

    }


    // ---------------------------------------------
    // VAZIO
    // ---------------------------------------------

    if (
        lista.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Nenhum agendamento
                nesta categoria.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    // ---------------------------------------------
    // CARDS
    // ---------------------------------------------

    lista.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "appointment";


            const statusClass =
                getStatusClass(
                    item.status
                );


            const preco =
                Number(
                    item.preco || 0
                );


            const pagoTexto =
                item.pago

                    ?
                    "✓ PAGO"

                    :
                    "Não pago";


            const pagoClass =
                item.pago

                    ?
                    "paid"

                    :
                    "unpaid";


            card.innerHTML = `

                <div class="appointment-header">

                    <h2>
                        ${escapeHTML(
                            item.nome
                        )}
                    </h2>


                    <span
                        class="status ${statusClass}"
                    >

                        ${escapeHTML(
                            item.status
                        )}

                    </span>

                </div>


                <div class="info">

                    📞
                    <strong>
                        Telefone:
                    </strong>

                    ${escapeHTML(
                        item.telefone
                    )}

                </div>


                <div class="info">

                    📧
                    <strong>
                        E-mail:
                    </strong>

                    ${escapeHTML(
                        item.email ||
                        "Não informado"
                    )}

                </div>


                <div class="info">

                    📅
                    <strong>
                        Data:
                    </strong>

                    ${escapeHTML(
                        item.data
                    )}

                </div>


                <div class="info">

                    🕐
                    <strong>
                        Horário:
                    </strong>

                    ${escapeHTML(
                        item.horario
                    )}

                </div>


                <div class="info">

                    ✂️
                    <strong>
                        Serviço:
                    </strong>

                    ${escapeHTML(
                        item.servico
                    )}

                </div>


                <div class="info">

                    💈
                    <strong>
                        Corte:
                    </strong>

                    ${escapeHTML(
                        item.tipo
                    )}

                </div>


                <div class="info">

                    📝
                    <strong>
                        Observações:
                    </strong>

                    ${escapeHTML(
                        item.observacoes ||
                        "Nenhuma"
                    )}

                </div>


                <div class="price">

                    <span>
                        💵 Valor
                    </span>

                    <span>
                        ${formatarPreco(
                            preco
                        )}
                    </span>

                </div>


                <div class="info">

                    💰
                    <strong>
                        Pagamento:
                    </strong>

                    <span class="${pagoClass}">

                        ${pagoTexto}

                    </span>

                </div>


                <div class="info">

                    <small>

                        Recebido:
                        ${formatarData(
                            item.enviadoEm
                        )}

                    </small>

                </div>


                <div class="actions">


                    ${
                        item.status !==
                        "Confirmado"

                        &&

                        item.status !==
                        "Finalizado"

                        ?

                        `

                        <button
                            class="confirm"
                            onclick="mudarStatus(
                                ${item.id},
                                'Confirmado'
                            )"
                        >

                            ✓ Confirmar

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        item.status !==
                        "Pendente"

                        &&

                        item.status !==
                        "Finalizado"

                        ?

                        `

                        <button
                            class="pending"
                            onclick="mudarStatus(
                                ${item.id},
                                'Pendente'
                            )"
                        >

                            ⏳ Pendente

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        item.status !==
                        "Cancelado"

                        &&

                        item.status !==
                        "Finalizado"

                        ?

                        `

                        <button
                            class="cancel"
                            onclick="mudarStatus(
                                ${item.id},
                                'Cancelado'
                            )"
                        >

                            ❌ Cancelar

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        !item.pago

                        ?

                        `

                        <button
                            class="payment"
                            onclick="mudarPagamento(
                                ${item.id},
                                true
                            )"
                        >

                            💰 Marcar Pago

                        </button>

                        `

                        :

                        `

                        <button
                            class="pending"
                            onclick="mudarPagamento(
                                ${item.id},
                                false
                            )"
                        >

                            ↩️ Desmarcar Pago

                        </button>

                        `

                    }


                    ${
                        item.status !==
                        "Finalizado"

                        ?

                        `

                        <button
                            class="finish"
                            onclick="finalizar(
                                ${item.id}
                            )"
                        >

                            ✂️ Finalizar Corte

                        </button>

                        `

                        :

                        ""

                    }


                    <button
                        class="delete"
                        onclick="apagar(
                            ${item.id}
                        )"
                    >

                        🗑️ Apagar

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


// =================================================
// STATUS
// =================================================

async function mudarStatus(
    id,
    status
) {


    if (
        status ===
        "Cancelado"
    ) {

        const confirmar =
            confirm(
                "Tem certeza que deseja cancelar este agendamento?"
            );


        if (!confirmar) {

            return;

        }

    }


    try {

        const response =
            await fetch(
                "/api/status",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            id,

                            status

                        })

                }
            );


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            alert(
                resultado.message ||
                "Erro ao atualizar."
            );

            return;

        }


        await carregar();

    }

    catch (error) {

        console.error(error);

        alert(
            "Erro de conexão."
        );

    }

}


// =================================================
// FINALIZAR
// =================================================

async function finalizar(
    id
) {


    const confirmar =
        confirm(

            "Finalizar este corte?\n\n" +

            "O horário será liberado " +

            "para outro cliente."

        );


    if (!confirmar) {

        return;

    }


    await mudarStatus(
        id,
        "Finalizado"
    );

}


// =================================================
// PAGAMENTO
// =================================================

async function mudarPagamento(
    id,
    pago
) {


    try {

        const response =
            await fetch(
                "/api/payment",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            id,

                            pago

                        })

                }
            );


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            alert(
                "Erro ao atualizar pagamento."
            );

            return;

        }


        await carregar();

    }

    catch (error) {

        console.error(error);

        alert(
            "Erro de conexão."
        );

    }

}


// =================================================
// APAGAR
// =================================================

async function apagar(
    id
) {


    const confirmar =
        confirm(

            "⚠️ APAGAR AGENDAMENTO?\n\n" +

            "Essa ação não pode ser desfeita."

        );


    if (!confirmar) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/delete",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            id

                        })

                }
            );


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            alert(
                resultado.message ||
                "Erro ao apagar."
            );

            return;

        }


        await carregar();

    }

    catch (error) {

        console.error(error);

        alert(
            "Erro de conexão."
        );

    }

}


// =================================================
// CLASSE DO STATUS
// =================================================

function getStatusClass(
    status
) {


    if (
        status ===
        "Pendente"
    ) {

        return "status-pendente";

    }


    if (
        status ===
        "Confirmado"
    ) {

        return "status-confirmado";

    }


    if (
        status ===
        "Cancelado"
    ) {

        return "status-cancelado";

    }


    if (
        status ===
        "Finalizado"
    ) {

        return "status-finalizado";

    }


    return "";

}


// =================================================
// ESCAPAR HTML
// =================================================

function escapeHTML(
    texto
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto ?? "";


    return div.innerHTML;

}


// =================================================
// PREÇO
// =================================================

function formatarPreco(
    valor
) {

    return "$" +

        Number(
            valor || 0
        ).toFixed(2);

}


// =================================================
// DATA
// =================================================

function formatarData(
    valor
) {


    if (!valor) {

        return "Não informado";

    }


    try {

        return new Date(
            valor
        ).toLocaleString(
            "pt-BR"
        );

    }

    catch {

        return valor;

    }

}


// =================================================
// INICIAR
// =================================================

carregar();


// Atualiza automaticamente
// a cada 5 segundos

setInterval(
    carregar,
    5000
);

</script>

</body>

</html>
