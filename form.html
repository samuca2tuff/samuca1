<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SAMUCA • Agendamento</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    font-family:
        Inter,
        Arial,
        sans-serif;
}

:root {

    --bg: #070707;
    --card: #101010;
    --card2: #151515;
    --border: #292929;

    --blue: #348cff;
    --blue2: #287cff;

    --green: #39ff88;
    --red: #ff5555;

    --text: #ffffff;
    --muted: #858585;

}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(52,140,255,.15),
            transparent 38%
        ),
        var(--bg);

    color: var(--text);

    display: flex;

    justify-content: center;

    padding: 40px 20px;

}


/* =====================================================
   CONTAINER
===================================================== */

.form {

    width: 100%;

    max-width: 650px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        ),
        var(--card);

    border: 1px solid var(--border);

    border-radius: 24px;

    padding: 42px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 50px rgba(52,140,255,.035);

}


/* =====================================================
   HEADER
===================================================== */

.logo {

    text-align: center;

    padding-bottom: 30px;

    margin-bottom: 10px;

    border-bottom: 1px solid #222;

}

.logo-badge {

    width: 58px;

    height: 58px;

    margin: 0 auto 16px;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #348cff,
            #1453ad
        );

    box-shadow:
        0 10px 30px rgba(52,140,255,.25);

}

.logo h1 {

    margin: 0;

    font-size: 38px;

    letter-spacing: 7px;

    font-weight: 800;

}

.logo h1 span {

    color: var(--blue);

}

.logo p {

    margin:

        10px

        0

        0;

    color: var(--muted);

    font-size: 11px;

    letter-spacing: 3px;

}


/* =====================================================
   SECTION
===================================================== */

.section {

    margin-top: 28px;

}

.section-title {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;

    font-size: 14px;

    font-weight: 700;

}

.section-number {

    width: 25px;

    height: 25px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(52,140,255,.12);

    color: var(--blue);

    font-size: 12px;

}


/* =====================================================
   LABEL
===================================================== */

label {

    display: block;

    margin:

        18px

        0

        8px;

    color: #bdbdbd;

    font-size: 12px;

    font-weight: 600;

}


/* =====================================================
   INPUTS
===================================================== */

input,
select,
textarea {

    width: 100%;

    padding: 15px 16px;

    background: #090909;

    border: 1px solid #292929;

    border-radius: 11px;

    color: white;

    outline: none;

    font-size: 14px;

    transition:

        border .2s,

        box-shadow .2s,

        background .2s;

}

input:hover,
select:hover,
textarea:hover {

    border-color: #3a3a3a;

}

input:focus,
select:focus,
textarea:focus {

    border-color: var(--blue);

    background: #0b0b0b;

    box-shadow:
        0 0 0 3px
        rgba(52,140,255,.08);

}

textarea {

    height: 110px;

    resize: vertical;

}

select {

    cursor: pointer;

}


/* =====================================================
   DATA
===================================================== */

input[type="date"] {

    color-scheme: dark;

}


/* =====================================================
   HORÁRIOS
===================================================== */

.horarios {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 10px;

}

.horario {

    min-height: 52px;

    padding: 10px;

    border-radius: 11px;

    border: 1px solid #292929;

    background: #090909;

    color: #eee;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    cursor: pointer;

    font-size: 13px;

    font-weight: 700;

    transition:

        transform .15s,

        border .15s,

        background .15s;

}

.horario:hover {

    transform: translateY(-2px);

    border-color: var(--blue);

    background: #0d1118;

}

.horario.selecionado {

    background:
        linear-gradient(
            135deg,
            #348cff,
            #2169c7
        );

    border-color: var(--blue);

    box-shadow:
        0 8px 25px
        rgba(52,140,255,.2);

}

.horario.ocupado {

    background: #211010;

    border-color: #482222;

    color: #ff6565;

    cursor: not-allowed;

    text-decoration: line-through;

}

.horario.ocupado:hover {

    transform: none;

    border-color: #482222;

    background: #211010;

}

.horario.loading {

    opacity: .5;

    cursor: wait;

}


/* =====================================================
   LEGENDA
===================================================== */

.legenda {

    display: flex;

    gap: 18px;

    margin-top: 12px;

    color: #777;

    font-size: 11px;

}

.legenda span {

    display: flex;

    align-items: center;

    gap: 6px;

}

.dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    display: inline-block;

}

.dot.disponivel {

    background: var(--green);

    box-shadow:
        0 0 8px
        rgba(57,255,136,.4);

}

.dot.ocupado {

    background: var(--red);

}


/* =====================================================
   PREÇO
===================================================== */

.preco-box {

    margin-top: 28px;

    padding: 22px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(57,255,136,.06),
            rgba(57,255,136,.015)
        );

    border: 1px solid
        rgba(57,255,136,.15);

}

.preco-titulo {

    color: #777;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

}

.preco {

    margin-top: 5px;

    font-size: 34px;

    font-weight: 800;

    color: var(--green);

}


/* =====================================================
   RESUMO
===================================================== */

.resumo-final {

    margin-top: 16px;

    padding: 24px;

    background: #0b0b0b;

    border: 1px solid
        rgba(52,140,255,.4);

    border-radius: 16px;

    box-shadow:
        inset 0 0 30px
        rgba(52,140,255,.025);

}

.resumo-titulo {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--blue);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1.5px;

    margin-bottom: 15px;

}

.resumo-item {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    padding: 8px 0;

    color: #777;

    font-size: 13px;

}

.resumo-item strong {

    color: #eee;

    text-align: right;

    font-size: 13px;

}

.linha {

    height: 1px;

    background: #292929;

    margin: 13px 0;

}

.total-final {

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.total-final span {

    color: white;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: 1px;

}

.total-final strong {

    font-size: 30px;

    font-weight: 800;

    color: var(--green);

}


/* =====================================================
   BOTÃO
===================================================== */

button.agendar {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #348cff,
            #2169c7
        );

    color: white;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: .5px;

    cursor: pointer;

    box-shadow:
        0 10px 30px
        rgba(52,140,255,.18);

    transition:

        transform .15s,

        box-shadow .15s,

        opacity .15s;

}

button.agendar:hover {

    transform: translateY(-2px);

    box-shadow:
        0 14px 35px
        rgba(52,140,255,.28);

}

button.agendar:active {

    transform: translateY(0);

}

button.agendar:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   STATUS
===================================================== */

#status {

    text-align: center;

    margin-top: 18px;

    color: #888;

    font-size: 13px;

    line-height: 1.6;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    margin-top: 28px;

    padding-top: 20px;

    border-top: 1px solid #222;

    color: #555;

    font-size: 10px;

    letter-spacing: 1px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 600px) {

    body {

        padding: 15px 10px;

    }

    .form {

        padding: 28px 20px;

        border-radius: 20px;

    }

    .logo h1 {

        font-size: 32px;

    }

    .horarios {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .resumo-item {

        font-size: 12px;

    }

}

</style>

</head>


<body>


<div class="form">


<!-- HEADER -->

<div class="logo">

    <div class="logo-badge">
        ✂
    </div>

    <h1>
        SAM<span>UCA</span>
    </h1>

    <p>
        BARBERSHOP • AGENDAMENTO ONLINE
    </p>

</div>


<!-- DADOS -->

<div class="section">

    <div class="section-title">

        <div class="section-number">
            01
        </div>

        Seus dados

    </div>


    <label>
        Nome completo *
    </label>

    <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
    >


    <label>
        Telefone *
    </label>

    <input
        id="telefone"
        type="tel"
        placeholder="(00) 00000-0000"
    >


    <label>
        E-mail
    </label>

    <input
        id="email"
        type="email"
        placeholder="seuemail@email.com"
    >

</div>


<!-- DATA E HORÁRIO -->

<div class="section">

    <div class="section-title">

        <div class="section-number">
            02
        </div>

        Data e horário

    </div>


    <label>
        📅 Escolha a data *
    </label>

    <input
        id="data"
        type="date"
    >


    <label>
        🕐 Escolha o horário *
    </label>

    <div
        id="horarios"
        class="horarios"
    >

        <div class="horario">
            Escolha uma data
        </div>

    </div>


    <div class="legenda">

        <span>
            <span class="dot disponivel"></span>
            Disponível
        </span>

        <span>
            <span class="dot ocupado"></span>
            Ocupado
        </span>

    </div>

</div>


<!-- SERVIÇO -->

<div class="section">

    <div class="section-title">

        <div class="section-number">
            03
        </div>

        Seu corte

    </div>


    <label>
        ✂️ Serviço *
    </label>

    <select id="servico">

        <option value="">
            Selecione o serviço
        </option>

        <option value="Corte masculino">
            Corte masculino — $25.00
        </option>

        <option value="Corte + barba">
            Corte + barba — $35.00
        </option>

        <option value="Barba">
            Barba — $15.00
        </option>

        <option value="Corte infantil">
            Corte infantil — $20.00
        </option>

    </select>


    <label>
        💈 Tipo de corte *
    </label>

    <select id="tipo">

        <option value="">
            Selecione o corte
        </option>

        <option>
            Degradê / Fade
        </option>

        <option>
            Taper Fade
        </option>

        <option>
            Social
        </option>

        <option>
            Buzz Cut
        </option>

        <option>
            Undercut
        </option>

        <option>
            Outro
        </option>

    </select>


    <label>
        📝 Observações
    </label>

    <textarea
        id="observacoes"
        placeholder="Ex: Não subir muito o degradê..."
    ></textarea>

</div>


<!-- PREÇO -->

<div class="preco-box">

    <div class="preco-titulo">
        VALOR DO SERVIÇO
    </div>

    <div
        class="preco"
        id="preco"
    >
        $0.00
    </div>

</div>


<!-- RESUMO -->

<div class="resumo-final">

    <div class="resumo-titulo">

        🧾 RESUMO DO AGENDAMENTO

    </div>


    <div class="resumo-item">

        <span>
            Serviço
        </span>

        <strong id="finalServico">
            —
        </strong>

    </div>


    <div class="resumo-item">

        <span>
            Data
        </span>

        <strong id="finalData">
            —
        </strong>

    </div>


    <div class="resumo-item">

        <span>
            Horário
        </span>

        <strong id="finalHorario">
            —
        </strong>

    </div>


    <div class="linha"></div>


    <div class="total-final">

        <span>
            TOTAL
        </span>

        <strong id="finalPreco">
            $0.00
        </strong>

    </div>

</div>


<!-- BOTÃO -->

<button
    id="botao"
    class="agendar"
    onclick="agendar()"
>

    ✂️ CONFIRMAR AGENDAMENTO

</button>


<div id="status"></div>


<div class="footer">

    SAMUCA BARBERSHOP • AGENDAMENTO ONLINE

</div>


</div>


<script>


/* =====================================================
   PREÇOS
===================================================== */

const PRECOS = {

    "Corte masculino": 25,

    "Corte + barba": 35,

    "Barba": 15,

    "Corte infantil": 20

};


/* =====================================================
   HORÁRIOS
===================================================== */

const HORARIOS = [

    "09:00",
    "09:30",
    "10:00",
    "10:30",
    "11:00",
    "11:30",

    "13:00",
    "13:30",
    "14:00",
    "14:30",
    "15:00",
    "15:30",

    "16:00",
    "16:30",
    "17:00",
    "17:30",
    "18:00",
    "18:30"

];


let horarioSelecionado = "";

let horariosOcupados = [];


/* =====================================================
   DATA
===================================================== */

const campoData =
    document.getElementById("data");


const hoje =
    new Date();


const ano =
    hoje.getFullYear();


const mes =
    String(
        hoje.getMonth() + 1
    ).padStart(2, "0");


const dia =
    String(
        hoje.getDate()
    ).padStart(2, "0");


campoData.min =
    `${ano}-${mes}-${dia}`;


/* =====================================================
   DATA ALTERADA
===================================================== */

campoData.addEventListener(
    "change",
    async function() {

        horarioSelecionado = "";

        atualizarResumo();

        await carregarHorarios();

    }
);


/* =====================================================
   SERVIÇO ALTERADO
===================================================== */

document
    .getElementById("servico")
    .addEventListener(
        "change",
        function() {

            atualizarPreco();

            atualizarResumo();

        }
    );


/* =====================================================
   CARREGAR HORÁRIOS
===================================================== */

async function carregarHorarios() {

    const data =
        campoData.value;

    const container =
        document.getElementById(
            "horarios"
        );


    if (!data) {

        container.innerHTML = `

            <div class="horario">

                Escolha uma data

            </div>

        `;

        return;

    }


    container.innerHTML = "";

    HORARIOS.forEach(
        horario => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "horario loading";

            div.textContent =
                "⏳";

            container.appendChild(
                div
            );

        }
    );


    try {

        const response =
            await fetch(
                "/api/horarios?data=" +
                encodeURIComponent(data)
            );


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            throw new Error(
                "Erro ao consultar horários"
            );

        }


        horariosOcupados =
            resultado.ocupados || [];


        renderizarHorarios();

    }

    catch(error) {

        console.error(error);


        container.innerHTML = `

            <div
                class="horario"
                style="
                    grid-column:1/-1;
                    color:#ff6b6b;
                "
            >

                ❌ Não foi possível
                carregar os horários.

                <br>

                Tente novamente.

            </div>

        `;

    }

}


/* =====================================================
   RENDERIZAR HORÁRIOS
===================================================== */

function renderizarHorarios() {

    const container =
        document.getElementById(
            "horarios"
        );


    container.innerHTML = "";


    HORARIOS.forEach(
        horario => {

            const ocupado =
                horariosOcupados.includes(
                    horario
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "horario";


            if (ocupado) {

                div.classList.add(
                    "ocupado"
                );


                div.innerHTML = `

                    ${horario}

                    <br>

                    <small>
                        🔴 OCUPADO
                    </small>

                `;

            }

            else {

                div.textContent =
                    horario;


                div.onclick =
                    function() {

                        selecionarHorario(
                            horario,
                            div
                        );

                    };

            }


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SELECIONAR HORÁRIO
===================================================== */

function selecionarHorario(
    horario,
    elemento
) {

    document
        .querySelectorAll(
            ".horario"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "selecionado"
                );

            }
        );


    elemento.classList.add(
        "selecionado"
    );


    horarioSelecionado =
        horario;


    atualizarResumo();

}


/* =====================================================
   PREÇO
===================================================== */

function atualizarPreco() {

    const servico =
        document.getElementById(
            "servico"
        ).value;


    const preco =
        PRECOS[servico] || 0;


    document.getElementById(
        "preco"
    ).textContent =

        "$" +
        preco.toFixed(2);


    document.getElementById(
        "finalPreco"
    ).textContent =

        "$" +
        preco.toFixed(2);

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo() {

    const servico =
        document.getElementById(
            "servico"
        ).value;


    const data =
        campoData.value;


    const preco =
        PRECOS[servico] || 0;


    document.getElementById(
        "finalServico"
    ).textContent =

        servico || "—";


    document.getElementById(
        "finalData"
    ).textContent =

        data || "—";


    document.getElementById(
        "finalHorario"
    ).textContent =

        horarioSelecionado || "—";


    document.getElementById(
        "finalPreco"
    ).textContent =

        "$" +
        preco.toFixed(2);

}


/* =====================================================
   AGENDAR
===================================================== */

async function agendar() {

    const botao =
        document.getElementById(
            "botao"
        );


    const status =
        document.getElementById(
            "status"
        );


    const dados = {

        nome:
            document.getElementById(
                "nome"
            ).value.trim(),

        telefone:
            document.getElementById(
                "telefone"
            ).value.trim(),

        email:
            document.getElementById(
                "email"
            ).value.trim(),

        data:
            campoData.value,

        horario:
            horarioSelecionado,

        servico:
            document.getElementById(
                "servico"
            ).value,

        tipo:
            document.getElementById(
                "tipo"
            ).value,

        observacoes:
            document.getElementById(
                "observacoes"
            ).value.trim()

    };


    if (

        !dados.nome ||

        !dados.telefone ||

        !dados.data ||

        !dados.horario ||

        !dados.servico ||

        !dados.tipo

    ) {

        status.style.color =
            "#ff6b6b";

        status.textContent =
            "❌ Preencha todos os campos obrigatórios.";

        return;

    }


    if (
        horariosOcupados.includes(
            dados.horario
        )
    ) {

        status.style.color =
            "#ff6b6b";

        status.textContent =
            "❌ Esse horário está ocupado. Escolha outro.";

        await carregarHorarios();

        return;

    }


    const preco =
        PRECOS[dados.servico];


    botao.disabled =
        true;


    status.style.color =
        "#aaa";


    status.textContent =
        "⏳ Confirmando seu agendamento...";


    try {

        const response =
            await fetch(
                "/api/submit",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            dados
                        )

                }
            );


        const resultado =
            await response.json();


        if (
            response.ok &&
            resultado.success
        ) {

            status.style.color =
                "#39ff88";


            status.innerHTML = `

                ✅ <strong>
                Agendamento enviado com sucesso!
                </strong>

                <br><br>

                📅 ${dados.data}

                <br>

                🕐 ${dados.horario}

                <br>

                ✂️ ${dados.servico}

                <br>

                💵 Total:
                <strong>
                $${preco.toFixed(2)}
                </strong>

            `;


            document.getElementById(
                "nome"
            ).value = "";


            document.getElementById(
                "telefone"
            ).value = "";


            document.getElementById(
                "email"
            ).value = "";


            document.getElementById(
                "data"
            ).value = "";


            document.getElementById(
                "servico"
            ).value = "";


            document.getElementById(
                "tipo"
            ).value = "";


            document.getElementById(
                "observacoes"
            ).value = "";


            horarioSelecionado =
                "";


            horariosOcupados =
                [];


            atualizarPreco();

            atualizarResumo();


            document.getElementById(
                "horarios"
            ).innerHTML = `

                <div class="horario">

                    Escolha uma data

                </div>

            `;

        }

        else if (
            response.status === 409
        ) {

            status.style.color =
                "#ff6b6b";


            status.innerHTML = `

                ❌ <strong>
                Horário indisponível
                </strong>

                <br>

                Esse horário acabou
                de ser reservado.

                <br>

                Escolha outro horário.

            `;


            await carregarHorarios();

        }

        else {

            status.style.color =
                "#ff6b6b";


            status.textContent =

                "❌ " +

                (
                    resultado.message ||
                    "Erro ao realizar agendamento."
                );

        }

    }

    catch(error) {

        console.error(error);


        status.style.color =
            "#ff6b6b";


        status.textContent =
            "❌ Servidor offline. Tente novamente.";

    }


    botao.disabled =
        false;

}

</script>

</body>

</html>
