<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMUCA BARBERSHOP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #080c14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .header h1 span {
      color: #3b82f6;
    }

    .header p {
      color: #9ca3af;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      height: 48px;
      background-color: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 0 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #4b5563;
    }

    /* FIX DO CAMPO DE DATA PARA IOS/SAFARI */
    input[type="date"] {
      color-scheme: dark;
      -webkit-appearance: none;
      appearance: none;
      color: #ffffff;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .info-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .info-box span.blue { color: #3b82f6; font-weight: 600; }
    .info-box span.icon { margin-right: 4px; }

    .status-group {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-green { background-color: #22c55e; }
    .dot-red { background-color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>SAM<span>UCA</span></h1>
      <p>BARBERSHOP • AGENDAMENTO</p>
    </div>

    <form>
      <div class="form-group">
        <label>Nome completo *</label>
        <input type="text" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label>Telefone *</label>
        <input type="tel" placeholder="(00) 00000-0000" required>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" placeholder="seuemail@email.com">
      </div>

      <div class="form-group">
        <label>📅 Escolha a data *</label>
        <input type="date" required>
        
        <div class="info-box">
          <p><span class="icon">📅</span> Você pode escolher <span class="blue">hoje</span> ou qualquer data futura.</p>
          <p><span class="icon">⛔</span> Datas anteriores a hoje não podem ser selecionadas.</p>
        </div>
      </div>

      <div class="form-group">
        <label>⏰ Escolha o horário *</label>
        <select required>
          <option value="" disabled selected>Escolha uma data</option>
        </select>

        <div class="status-group">
          <div class="status-item"><span class="dot dot-green"></span> Disponível</div>
          <div class="status-item"><span class="dot dot-red"></span> Ocupado</div>
        </div>
      </div>

      <div class="form-group">
        <label>✂️ Serviço *</label>
        <select required>
          <option value="" disabled selected>Selecione o serviço</option>
        </select>
      </div>
    </form>
  </div>

</body>
</html>
