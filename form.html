<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SAMUCA • Agendamento</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #080808;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px;
}

.form {

    width: 520px;

    background: #111;

    border: 1px solid #292929;

    border-radius: 18px;

    padding: 35px;
}

.logo {

    text-align: center;

    margin-bottom: 30px;
}

.logo h1 {

    margin: 0;

    font-size: 36px;

    letter-spacing: 5px;
}

.logo span {

    color: #348cff;
}

.logo p {

    color: #777;

    font-size: 12px;

    letter-spacing: 2px;
}

label {

    display: block;

    margin-top: 18px;

    margin-bottom: 7px;

    color: #aaa;

    font-size: 13px;
}

input,
select,
textarea {

    width: 100%;

    padding: 14px;

    background: #090909;

    border: 1px solid #292929;

    border-radius: 8px;

    color: white;

    outline: none;
}

input:focus,
select:focus,
textarea:focus {

    border-color: #348cff;
}

textarea {

    height: 100px;

    resize: vertical;
}


/* ================================
   HORÁRIOS
================================ */

.horarios {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 8px;
}

.horario {

    padding: 12px 5px;

    border-radius: 8px;

    border: 1px solid #292929;

    background: #090909;

    color: white;

    text-align: center;

    cursor: pointer;

    transition: .15s;

    font-weight: bold;
}

.horario:hover {

    border-color: #348cff;

}

.horario.selecionado {

    background: #287cff;

    border-color: #287cff;

}

.horario.ocupado {

    background: #321515;

    border-color: #652525;

    color: #ff6b6b;

    cursor: not-allowed;

    text-decoration: line-through;

}

.horario.ocupado:hover {

    border-color: #652525;

}

.horario.loading {

    opacity: .5;

    cursor: wait;

}


/* ================================
   LEGENDA
================================ */

.legenda {

    display: flex;

    gap: 15px;

    margin-top: 12px;

    font-size: 12px;

    color: #888;

}

.legenda span {

    display: flex;

    align-items: center;

    gap: 5px;

}

.dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    display: inline-block;

}

.dot.disponivel {

    background: #39ff88;
}

.dot.ocupado {

    background: #ff4d4d;
}


/* ================================
   PREÇO
================================ */

.preco-box {

    margin-top: 25px;

    padding: 20px;

    background: #090909;

    border: 1px solid #292929;

    border-radius: 12px;
}

.preco-titulo {

    color: #888;

    font-size: 12px;

    margin-bottom: 8px;
}

.preco {

    font-size: 30px;

    font-weight: bold;

    color: #39ff88;
}


/* ================================
   RESUMO
================================ */

.resumo {

    margin-top: 15px;

    padding: 15px;

    background: #0c0c0c;

    border: 1px solid #292929;

    border-radius: 10px;

    display: none;
}

.resumo.mostrar {

    display: block;
}

.resumo-linha {

    display: flex;

    justify-content: space-between;

    padding: 5px 0;

    color: #aaa;
}

.resumo-linha strong {

    color: white;
}


/* ================================
   BOTÃO
================================ */

button.agendar {

    width: 100%;

    margin-top: 25px;

    padding: 16px;

    background: #287cff;

    border: none;

    border-radius: 8px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 15px;
}

button.agendar:hover {

    background: #348cff;
}

button.agendar:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* ================================
   STATUS
================================ */

#status {

    text-align: center;

    margin-top: 15px;

    color: #aaa;

    line-height: 1.5;
}


/* ================================
   MOBILE
================================ */

@media(max-width: 500px) {

    body {

        padding: 15px;

    }

    .form {

        padding: 25px 18px;

    }

    .horarios {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

</style>

</head>

<body>


<div class="form">


<div class="logo">

<h1>
SAM<span>UCA</span>
</h1>

<p>
BARBERSHOP • AGENDAMENTO
</p>

</div>


<!-- ================================
     NOME
================================ -->

<label>
Nome completo *
</label>

<input
id="nome"
type="text"
placeholder="Digite seu nome"
>


<!-- ================================
     TELEFONE
================================ -->

<label>
Telefone *
</label>

<input
id="telefone"
type="tel"
placeholder="(00) 00000-0000"
>


<!-- ================================
     EMAIL
================================ -->

<label>
E-mail
</label>

<input
id="email"
type="email"
placeholder="seuemail@email.com"
>


<!-- ================================
     DATA
================================ -->

<label>
📅 Escolha a data *
</label>

<input
id="data"
type="date"
>


<!-- ================================
     HORÁRIOS
================================ -->

<label>
🕐 Escolha o horário *
</label>

<div
    id="horarios"
    class="horarios"
>

    <div class="horario">
        Escolha uma data
    </div>

</div>


<div class="legenda">

    <span>
        <span class="dot disponivel"></span>
        Disponível
    </span>

    <span>
        <span class="dot ocupado"></span>
        Ocupado
    </span>

</div>


<!-- ================================
     SERVIÇO
================================ -->

<label>
✂️ Serviço *
</label>

<select id="servico">

<option value="">
Selecione o serviço
</option>

<option value="Corte masculino">
Corte masculino — $25.00
</option>

<option value="Corte + barba">
Corte + barba — $35.00
</option>

<option value="Barba">
Barba — $15.00
</option>

<option value="Corte infantil">
Corte infantil — $20.00
</option>

</select>


<!-- ================================
     TIPO
================================ -->

<label>
💈 Tipo de corte *
</label>

<select id="tipo">

<option value="">
Selecione o corte
</option>

<option>
Degradê / Fade
</option>

<option>
Taper Fade
</option>

<option>
Social
</option>

<option>
Buzz Cut
</option>

<option>
Undercut
</option>

<option>
Outro
</option>

</select>


<!-- ================================
     OBSERVAÇÕES
================================ -->

<label>
📝 Observações
</label>

<textarea
id="observacoes"
placeholder="Ex: Não subir muito o degradê..."
></textarea>


<!-- ================================
     PREÇO
================================ -->

<div class="preco-box">

    <div class="preco-titulo">
        VALOR DO SERVIÇO
    </div>

    <div
        class="preco"
        id="preco"
    >
        $0.00
    </div>

</div>


<!-- ================================
     RESUMO
================================ -->

<div
    id="resumo"
    class="resumo"
>

    <div class="resumo-linha">

        <span>
            Serviço
        </span>

        <strong id="resumoServico">
            —
        </strong>

    </div>


    <div class="resumo-linha">

        <span>
            Data
        </span>

        <strong id="resumoData">
            —
        </strong>

    </div>


    <div class="resumo-linha">

        <span>
            Horário
        </span>

        <strong id="resumoHorario">
            —
        </strong>

    </div>


    <div class="resumo-linha">

        <span>
            Total
        </span>

        <strong
            id="resumoPreco"
            style="color:#39ff88"
        >
            $0.00
        </strong>

    </div>

</div>


<!-- ================================
     BOTÃO
================================ -->

<button
    id="botao"
    class="agendar"
    onclick="agendar()"
>

    ✂️ AGENDAR CORTE

</button>


<div id="status"></div>


</div>


<script>


// =====================================================
// PREÇOS
// =====================================================

const PRECOS = {

    "Corte masculino": 25,

    "Corte + barba": 35,

    "Barba": 15,

    "Corte infantil": 20

};


// =====================================================
// HORÁRIOS
// =====================================================

const HORARIOS = [

    "09:00",
    "09:30",
    "10:00",
    "10:30",
    "11:00",
    "11:30",

    "13:00",
    "13:30",
    "14:00",
    "14:30",
    "15:00",
    "15:30",

    "16:00",
    "16:30",
    "17:00",
    "17:30",
    "18:00",
    "18:30"

];


let horarioSelecionado = "";

let horariosOcupados = [];


// =====================================================
// DATA MÍNIMA
// =====================================================

const campoData =
    document.getElementById("data");


// Impede escolher datas passadas

const hoje =
    new Date();


const ano =
    hoje.getFullYear();

const mes =
    String(
        hoje.getMonth() + 1
    ).padStart(2, "0");

const dia =
    String(
        hoje.getDate()
    ).padStart(2, "0");


campoData.min =
    `${ano}-${mes}-${dia}`;


// =====================================================
// QUANDO ESCOLHER DATA
// =====================================================

campoData.addEventListener(
    "change",
    async function() {

        horarioSelecionado =
            "";

        atualizarResumo();

        await carregarHorarios();

    }
);


// =====================================================
// QUANDO ESCOLHER SERVIÇO
// =====================================================

document
    .getElementById("servico")
    .addEventListener(
        "change",
        function() {

            atualizarPreco();

            atualizarResumo();

        }
    );


// =====================================================
// CARREGAR HORÁRIOS
// =====================================================

async function carregarHorarios() {


    const data =
        campoData.value;


    const container =
        document.getElementById(
            "horarios"
        );


    if (!data) {

        container.innerHTML = `

            <div class="horario">

                Escolha uma data

            </div>

        `;

        return;

    }


    // ---------------------------------------------
    // LOADING
    // ---------------------------------------------

    container.innerHTML = "";

    HORARIOS.forEach(
        horario => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "horario loading";

            div.textContent =
                "⏳";

            container.appendChild(
                div
            );

        }
    );


    try {

        const response =
            await fetch(
                "/api/horarios?data=" +
                encodeURIComponent(data)
            );


        const resultado =
            await response.json();


        if (
            !resultado.success
        ) {

            throw new Error(
                "Erro ao consultar horários"
            );

        }


        horariosOcupados =
            resultado.ocupados || [];


        renderizarHorarios();


    }

    catch(error) {

        console.error(error);


        container.innerHTML = `

            <div
                class="horario"
                style="
                    grid-column:1/-1;
                    color:#ff6b6b;
                "
            >

                ❌ Não foi possível
                carregar os horários.

                <br>

                Tente novamente.

            </div>

        `;

    }

}


// =====================================================
// MOSTRAR HORÁRIOS
// =====================================================

function renderizarHorarios() {


    const container =
        document.getElementById(
            "horarios"
        );


    container.innerHTML = "";


    HORARIOS.forEach(
        horario => {


            const ocupado =
                horariosOcupados.includes(
                    horario
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "horario";


            // -----------------------------------------
            // OCUPADO
            // -----------------------------------------

            if (ocupado) {

                div.classList.add(
                    "ocupado"
                );

                div.innerHTML = `
                    ${horario}
                    <br>
                    <small>
                        OCUPADO
                    </small>
                `;

            }


            // -----------------------------------------
            // DISPONÍVEL
            // -----------------------------------------

            else {

                div.textContent =
                    horario;


                div.onclick =
                    function() {

                        selecionarHorario(
                            horario,
                            div
                        );

                    };

            }


            container.appendChild(
                div
            );

        }
    );

}


// =====================================================
// SELECIONAR HORÁRIO
// =====================================================

function selecionarHorario(
    horario,
    elemento
) {


    document
        .querySelectorAll(
            ".horario"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "selecionado"
                );

            }
        );


    elemento.classList.add(
        "selecionado"
    );


    horarioSelecionado =
        horario;


    atualizarResumo();

}


// =====================================================
// PREÇO
// =====================================================

function atualizarPreco() {


    const servico =
        document.getElementById(
            "servico"
        ).value;


    const preco =
        PRECOS[servico] || 0;


    document.getElementById(
        "preco"
    ).textContent =

        "$" +
        preco.toFixed(2);


    document.getElementById(
        "resumoPreco"
    ).textContent =

        "$" +
        preco.toFixed(2);

}


// =====================================================
// RESUMO
// =====================================================

function atualizarResumo() {


    const servico =
        document.getElementById(
            "servico"
        ).value;


    const data =
        campoData.value;


    const resumo =
        document.getElementById(
            "resumo"
        );


    document.getElementById(
        "resumoServico"
    ).textContent =

        servico ||
        "—";


    document.getElementById(
        "resumoData"
    ).textContent =

        data ||
        "—";


    document.getElementById(
        "resumoHorario"
    ).textContent =

        horarioSelecionado ||
        "—";


    const preco =
        PRECOS[servico] || 0;


    document.getElementById(
        "resumoPreco"
    ).textContent =

        "$" +
        preco.toFixed(2);


    if (
        servico ||
        data ||
        horarioSelecionado
    ) {

        resumo.classList.add(
            "mostrar"
        );

    }

}


// =====================================================
// AGENDAR
// =====================================================

async function agendar() {


    const botao =
        document.getElementById(
            "botao"
        );


    const status =
        document.getElementById(
            "status"
        );


    const dados = {


        nome:
            document.getElementById(
                "nome"
            ).value.trim(),


        telefone:
            document.getElementById(
                "telefone"
            ).value.trim(),


        email:
            document.getElementById(
                "email"
            ).value.trim(),


        data:
            campoData.value,


        horario:
            horarioSelecionado,


        servico:
            document.getElementById(
                "servico"
            ).value,


        tipo:
            document.getElementById(
                "tipo"
            ).value,


        observacoes:
            document.getElementById(
                "observacoes"
            ).value.trim()

    };


    // =================================================
    // VALIDAR
    // =================================================

    if (

        !dados.nome ||

        !dados.telefone ||

        !dados.data ||

        !dados.horario ||

        !dados.servico ||

        !dados.tipo

    ) {

        status.style.color =
            "#ff6b6b";

        status.textContent =
            "❌ Preencha todos os campos obrigatórios.";

        return;

    }


    // =================================================
    // VERIFICAÇÃO LOCAL
    // =================================================

    if (
        horariosOcupados.includes(
            dados.horario
        )
    ) {

        status.style.color =
            "#ff6b6b";

        status.textContent =
            "❌ Esse horário acabou de ser ocupado. Escolha outro.";

        await carregarHorarios();

        return;

    }


    // =================================================
    // PREÇO
    // =================================================

    const preco =
        PRECOS[dados.servico];


    // =================================================
    // BOTÃO
    // =================================================

    botao.disabled =
        true;


    status.style.color =
        "#aaa";


    status.textContent =
        "⏳ Confirmando seu agendamento...";


    try {


        const response =
            await fetch(
                "/api/submit",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            dados
                        )

                }
            );


        const resultado =
            await response.json();


        // =================================================
        // SUCESSO
        // =================================================

        if (
            response.ok &&
            resultado.success
        ) {


            status.style.color =
                "#39ff88";


            status.innerHTML = `

                ✅ <strong>
                Agendamento confirmado!
                </strong>

                <br>

                📅 ${dados.data}

                • 🕐 ${dados.horario}

                <br>

                💵 Total:
                $${preco.toFixed(2)}

            `;


            // Limpar formulário

            document.getElementById(
                "nome"
            ).value = "";


            document.getElementById(
                "telefone"
            ).value = "";


            document.getElementById(
                "email"
            ).value = "";


            document.getElementById(
                "data"
            ).value = "";


            document.getElementById(
                "servico"
            ).value = "";


            document.getElementById(
                "tipo"
            ).value = "";


            document.getElementById(
                "observacoes"
            ).value = "";


            horarioSelecionado =
                "";


            atualizarPreco();


            document.getElementById(
                "resumo"
            ).classList.remove(
                "mostrar"
            );


            document.getElementById(
                "horarios"
            ).innerHTML = `

                <div class="horario">

                    Escolha uma data

                </div>

            `;

        }


        // =================================================
        // HORÁRIO OCUPADO
        // =================================================

        else if (
            response.status ===
            409
        ) {


            status.style.color =
                "#ff6b6b";


            status.innerHTML = `

                ❌ <strong>
                Horário indisponível
                </strong>

                <br>

                Esse horário acabou
                de ser reservado.

                <br>

                Escolha outro horário.

            `;


            await carregarHorarios();

        }


        // =================================================
        // OUTRO ERRO
        // =================================================

        else {


            status.style.color =
                "#ff6b6b";


            status.textContent =

                "❌ " +

                (
                    resultado.message ||
                    "Erro ao realizar agendamento."
                );

        }

    }


    catch(error) {


        console.error(
            error
        );


        status.style.color =
            "#ff6b6b";


        status.textContent =
            "❌ Servidor offline. Tente novamente.";

    }


    botao.disabled =
        false;

}

</script>

</body>

</html>
